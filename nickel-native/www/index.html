<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nickel</title>
<style>
  html,body { margin:0; height:100%; background:#34618c; color:#fff; font-family:-apple-system,system-ui,Roboto,sans-serif; }
  .wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  img { width:88px; height:88px; border-radius:22px; }
  h1 { font-size:22px; margin:18px 0 6px; }
  p { font-size:14px; opacity:.85; max-width:280px; line-height:1.5; }
  a { margin-top:18px; display:inline-block; background:#fff; color:#1e4b7d; text-decoration:none; font-weight:600; padding:12px 22px; border-radius:12px; font-size:15px; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="icon.png" alt="Nickel" onerror="this.style.display='none'" />
    <h1>Nickel</h1>
    <p>Connecting… If Nickel doesn't load, check your internet connection.</p>
    <a href="https://nickelcare.com">Open Nickel</a>
