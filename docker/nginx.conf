# ── marketing.sapphireclinicseast.org — HTTPS ─────────────────────────────────
server {
    listen 443 ssl;
    server_name marketing.sapphireclinicseast.org;

    ssl_certificate /etc/letsencrypt/live/marketing.sapphireclinicseast.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketing.sapphireclinicseast.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 200M;

    # Uploaded media files — strip Next.js RSC Vary headers so Instagram can fetch them
    location /api/uploads/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Vary;
        add_header Vary 'Accept-Encoding';
        add_header Access-Control-Allow-Origin '*';
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── survey.sapphireclinicseast.org — HTTPS ───────────────────────────────────
#    Public patient survey form + API proxy
server {
    listen 443 ssl;
    server_name survey.sapphireclinicseast.org;

    ssl_certificate     /etc/letsencrypt/live/survey.sapphireclinicseast.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/survey.sapphireclinicseast.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/sapphireclinicseast.org;
    index survey.html;

    # Serve survey.html as the default page
    location = / {
        try_files /survey.html =404;
    }

    # Survey API — proxy to Next.js app (handles /api/customer-survey/assignment/*)
    location /api/customer-survey {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host marketing.sapphireclinicseast.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

