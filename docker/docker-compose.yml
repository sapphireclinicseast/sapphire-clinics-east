services:
  postgres:
    image: postgres:16-alpine
    container_name: sapphire_db
    restart: always
    environment:
      POSTGRES_DB: sapphire_marketing
      POSTGRES_USER: sapphire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapphire -d sapphire_marketing"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sapphire_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrator
    container_name: sapphire_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sapphire:${POSTGRES_PASSWORD}@postgres:5432/sapphire_marketing

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sapphire_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sapphire:${POSTGRES_PASSWORD}@postgres:5432/sapphire_marketing
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN}
      META_PAGE_ID: ${META_PAGE_ID}
      META_IG_ACCOUNT_ID: ${META_IG_ACCOUNT_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      MEET_LINK_SECRET: ${MEET_LINK_SECRET}
      MEET_BASE_URL: ${MEET_BASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CANVA_CLIENT_ID: ${CANVA_CLIENT_ID}
      CANVA_CLIENT_SECRET: ${CANVA_CLIENT_SECRET}
      GMAIL_RESET_USER: ${GMAIL_RESET_USER}
      GMAIL_RESET_PASS: ${GMAIL_RESET_PASS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      HTTPSMS_API_KEY_SBEA: ${HTTPSMS_API_KEY_SBEA}
      HTTPSMS_API_KEY_SBGH: ${HTTPSMS_API_KEY_SBGH}
      VIBER_BOT_TOKEN_SBEA: ${VIBER_BOT_TOKEN_SBEA}
      VIBER_BOT_TOKEN_SBGH: ${VIBER_BOT_TOKEN_SBGH}
      UPLOAD_DIR: /app/uploads
      BODY_SIZE_LIMIT: 200mb
      AUTH_TRUST_HOST: "true"
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY}
      HR_PLATFORM_URL: ${HR_PLATFORM_URL:-http://host.docker.internal:3457}
      HR_PLATFORM_API_KEY: ${HR_PLATFORM_API_KEY}
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY}
      PAYMONGO_PUBLIC_KEY: ${PAYMONGO_PUBLIC_KEY}
      PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET}
      # Per-branch PayMongo accounts (booking downpayments route by branch)
      PAYMONGO_SECRET_KEY_SBEA: ${PAYMONGO_SECRET_KEY_SBEA}
      PAYMONGO_SECRET_KEY_SBGH: ${PAYMONGO_SECRET_KEY_SBGH}
      PAYMONGO_WEBHOOK_SECRET_SBEA: ${PAYMONGO_WEBHOOK_SECRET_SBEA}
      PAYMONGO_WEBHOOK_SECRET_SBGH: ${PAYMONGO_WEBHOOK_SECRET_SBGH}
      # Homecare PT distance/geocoding (OpenRouteService). Reused from the
      # Verdana store's key. Optional — the fare engine falls back to
      # straight-line distance if unset.
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY}
      PATIENT_PORTAL_SECRET: ${PATIENT_PORTAL_SECRET}
      CLIENT_PORTAL_URL: ${CLIENT_PORTAL_URL:-https://client.sapphireclinicseast.org}
      CLASS_PORTAL_JWT_SECRET: ${CLASS_PORTAL_JWT_SECRET}
      AURORA_ADMIN_TOKEN: ${AURORA_ADMIN_TOKEN}
      # Auth for the VPS crontab that fires /api/public/class-portal/cron/payment-reminders.
      CRON_SECRET: ${CRON_SECRET}
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    volumes:
      - /opt/sapphire/uploads:/app/uploads
      - /var/www/sapphireclinicseast.org/teletherapy/uploads:/app/teletherapy-uploads:ro
    ports:
      - "3000:3000"

  client-portal:
    build:
      context: ../client-portal
      dockerfile: Dockerfile
    container_name: sapphire_client_portal
    restart: always
    depends_on:
      app:
        condition: service_started
    environment:
      MARKETING_URL: ${MARKETING_URL:-https://operations.sapphireclinicseast.org}
      ACCOUNTING_URL: ${ACCOUNTING_URL:-https://accounting.sapphireclinicseast.org}
      # Aurora chatbot admin console (/admin). Password gates login; token must
      # match the marketing app's AURORA_ADMIN_TOKEN to authorize edits.
      AURORA_ADMIN_PASSWORD: ${AURORA_ADMIN_PASSWORD}
      AURORA_ADMIN_TOKEN: ${AURORA_ADMIN_TOKEN}
      # Provider sign-in/up bridge: shared secret with the staff app + its URL.
      PROVIDER_HANDOFF_SECRET: ${PROVIDER_HANDOFF_SECRET}
      STAFF_PORTAL_URL: ${STAFF_PORTAL_URL:-https://staff.sapphireclinicseast.org}
      # Optional override for the hero 3D scene (Spline). When unset the
      # component falls back to the public placeholder URL baked into
      # the source. Pass the .splinecode URL from app.spline.design.
      NEXT_PUBLIC_SPLINE_HERO_SCENE: ${NEXT_PUBLIC_SPLINE_HERO_SCENE:-}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3005:3000"

  class-portal:
    build:
      context: ../class-portal
      dockerfile: Dockerfile
    container_name: sapphire_class_portal
    restart: always
    depends_on:
      app:
        condition: service_started
    environment:
      MARKETING_URL: ${MARKETING_URL:-https://operations.sapphireclinicseast.org}
      # Server-side PayMongo secret key for /api/pay/create-checkout.
      # Pinned to the class-portal-specific key; falls back to the global
      # PAYMONGO_SECRET_KEY if the class-specific one isn't set.
      PAYMONGO_SECRET_KEY: ${PAYMONGO_CLASS_SECRET_KEY:-${PAYMONGO_SECRET_KEY}}
      # Per-branch PayMongo keys — /api/pay/create-checkout picks the
      # right one so East tuition settles into East's PayMongo account
      # and Greenhills into Greenhills'. Falls back to PAYMONGO_SECRET_KEY
      # (above) when a branch key isn't set. Prefer class-portal-specific
      # per-branch keys if you want to segregate the school's PayMongo
      # merchant accounts from the clinic's; otherwise the shared keys
      # (populated for the operations hub) are the sane default.
      PAYMONGO_SECRET_KEY_SBEA: ${PAYMONGO_CLASS_SECRET_KEY_SBEA:-${PAYMONGO_SECRET_KEY_SBEA}}
      PAYMONGO_SECRET_KEY_SBGH: ${PAYMONGO_CLASS_SECRET_KEY_SBGH:-${PAYMONGO_SECRET_KEY_SBGH}}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3006:3000"

  # Nickel — standalone homecare marketplace (nickel.sapphireclinicseast.org).
  # Its OWN database (sapphire_nickel). Patient payments settle into the
  # Verdana PayMongo account.
  nickel:
    build:
      context: ../nickel
      dockerfile: Dockerfile
    container_name: sapphire_nickel_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sapphire:${POSTGRES_PASSWORD}@postgres:5432/sapphire_nickel
      NEXTAUTH_URL: https://nickelcare.com
      NEXTAUTH_SECRET: ${NICKEL_NEXTAUTH_SECRET}
      NICKEL_ADMIN_EMAIL: ${NICKEL_ADMIN_EMAIL:-main@sapphireclinicseast.org}
      NICKEL_ADMIN_PASSWORD: ${NICKEL_ADMIN_PASSWORD:-}
      AUTH_TRUST_HOST: "true"
      PAYMONGO_SECRET_KEY: ${PAYMONGO_VERDANA_SECRET_KEY:-${PAYMONGO_SECRET_KEY}}
      # Verdana-only: never fall back to the East/main webhook secret, or real
      # Verdana-signed webhooks would 401 and bookings would never flip to PAID.
      # Unset until the Nickel webhook is registered on the Verdana account; the
      # route then accepts unverified (logs a warning) so bookings still settle.
      PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_VERDANA_WEBHOOK_SECRET:-}
      # Nickel's own LiveKit project (teleconsults). Values live in .env.production.
      NICKEL_LIVEKIT_URL: ${NICKEL_LIVEKIT_URL:-}
      NICKEL_LIVEKIT_API_KEY: ${NICKEL_LIVEKIT_API_KEY:-}
      NICKEL_LIVEKIT_API_SECRET: ${NICKEL_LIVEKIT_API_SECRET:-}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3007:3000"

volumes:
  postgres_data:
  redis_data:
