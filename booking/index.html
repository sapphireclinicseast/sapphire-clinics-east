<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Session — Sapphire Clinics East, Inc.</title>
  <meta name="description" content="Book a session with Sapphire Clinics East, Inc." />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .embed-frame { display: block; border: 0; width: 100vw; height: 100vh; }
    .fallback {
      display: none; padding: 48px 24px; max-width: 640px; margin: 0 auto; text-align: center; color: #1f2937;
    }
    .fallback h1 { font-size: 22px; margin: 0 0 12px; }
    .fallback a {
      display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 8px;
      background: #d97706; color: #fff; text-decoration: none; font-weight: 600;
    }
    @media (max-width: 600px) {
      .embed-frame { height: 100dvh; }
    }
  </style>
</head>
<body>
  <iframe
    id="bookingFrame"
    class="embed-frame"
    title="Sapphire Clinics East — Book a Session"
    allow="clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <noscript>
    <div class="fallback" style="display:block">
      <h1>Book a Session at Sapphire Clinics East</h1>
      <p>Open the client portal to continue.</p>
      <a href="https://client.sapphireclinicseast.org/">Open Client Portal →</a>
    </div>
  </noscript>
  <div class="fallback" id="fallback">
    <h1>Book a Session at Sapphire Clinics East</h1>
    <p>If the booking portal does not load below, open it directly:</p>
    <a href="https://client.sapphireclinicseast.org/" target="_blank" rel="noopener">Open Client Portal →</a>
  </div>
  <script>
    // Cache-bust the embed so /booking/ always loads the LATEST client-portal
    // build (e.g. live survey feedback) instead of a stale cached version.
    (function () {
      var f = document.getElementById('bookingFrame');
      if (f) f.src = 'https://client.sapphireclinicseast.org/?embedded=1&t=' + Date.now();
    })();
  </script>
</body>
</html>
