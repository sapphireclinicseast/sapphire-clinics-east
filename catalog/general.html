<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCEI · Aura Health Rehab — Company Booklet</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#244952; --green:#4a8073; --gold:#c69849; --cream:#f4f7e6;
    --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; --head:'DM Sans','Inter',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--font);background:radial-gradient(circle at 50% -10%,#2f5e69,#152c32 70%);color:#eaf1ec;
       display:flex;flex-direction:column;min-height:100vh;overflow:hidden}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;flex:0 0 auto;z-index:5}
  .topbar a,.topbar button{font-family:var(--font);font-size:13px;font-weight:600;color:#eaf1ec;background:rgba(255,255,255,.10);
       border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 15px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:.15s}
  .topbar a:hover,.topbar button:hover{background:rgba(255,255,255,.2)}
  .title{font-family:var(--head);font-weight:700;font-size:14px;opacity:.9;text-align:center;letter-spacing:.02em;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;padding:6px 12px}
  .book{position:relative;height:min(100%,calc(94vw*1.414));aspect-ratio:1 / 1.414;
        border-radius:8px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5);background:#0d1f24}
  .book img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--cream);
            opacity:0;transition:opacity .28s ease}
  .book img.show{opacity:1}
  .book.flip img.show{animation:pageIn .42s cubic-bezier(.4,.05,.25,1)}
  @keyframes pageIn{from{opacity:.2;transform:translateX(14px) scale(.985)}to{opacity:1;transform:none}}

  /* click zones */
  .zone{position:absolute;top:0;bottom:0;width:38%;cursor:pointer;z-index:2}
  .zone.prev{left:0} .zone.next{right:0}

  .nav{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 16px 22px;flex:0 0 auto;z-index:5}
  .arw{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);
       color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .arw:hover:not(:disabled){background:var(--gold);border-color:var(--gold)}
  .arw:disabled{opacity:.3;cursor:default}
  .counter{font-family:var(--head);font-weight:700;font-size:14px;min-width:74px;text-align:center;letter-spacing:.04em}
  .counter b{color:var(--gold)}

  @media (max-width:560px){
    .title{display:none}
    .book{height:min(76vh,calc(94vw*1.414))}
    .zone{width:42%}
  }
</style>
</head>
<body>
  <div class="topbar">
    <a href="/catalog/">← Catalogs</a>
    <div class="title">SCEI · Aura Health Rehab — Company Booklet</div>
    <span aria-hidden="true" style="width:92px"></span>
  </div>

  <div class="stage">
    <div class="book" id="book">
      <img id="imgA" alt="Booklet page">
      <img id="imgB" alt="Booklet page">
      <div class="zone prev" id="zPrev" aria-label="Previous page"></div>
      <div class="zone next" id="zNext" aria-label="Next page"></div>
    </div>
  </div>

  <div class="nav">
    <button class="arw" id="prev" aria-label="Previous page">‹</button>
    <div class="counter"><b id="cur">1</b> / <span id="total">19</span></div>
    <button class="arw" id="next" aria-label="Next page">›</button>
  </div>

<script>
(function(){
  "use strict";
  var TOTAL=19;
  var src=function(n){ return 'general/pages/p-'+String(n).padStart(2,'0')+'.jpg'; };
  var page=1, active='A';
  var imgA=document.getElementById('imgA'), imgB=document.getElementById('imgB');
  var book=document.getElementById('book');
  var cur=document.getElementById('cur'), prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  document.getElementById('total').textContent=TOTAL;

  var cache={};
  function preload(n){ if(n<1||n>TOTAL||cache[n])return; var i=new Image(); i.src=src(n); cache[n]=i; }

  function show(n, dir){
    n=Math.max(1,Math.min(TOTAL,n));
    if(n===page && cur.textContent==n) { return; }
    var incoming = active==='A' ? imgB : imgA;
    var outgoing = active==='A' ? imgA : imgB;
    incoming.onload=function(){
      incoming.classList.add('show');
      outgoing.classList.remove('show');
      book.classList.remove('flip'); void book.offsetWidth; book.classList.add('flip');
    };
    incoming.src=src(n);
    if(incoming.complete){ incoming.onload(); }
    active = active==='A' ? 'B' : 'A';
    page=n; cur.textContent=n;
    prevBtn.disabled = n<=1; nextBtn.disabled = n>=TOTAL;
    preload(n+1); preload(n-1); preload(n+2);
  }

  function go(delta){ show(page+delta, delta); }

  // init
  imgA.src=src(1); imgA.onload=function(){ imgA.classList.add('show'); }; if(imgA.complete) imgA.classList.add('show');
  prevBtn.disabled=true; preload(2); preload(3);

  prevBtn.onclick=function(){ go(-1); };
  nextBtn.onclick=function(){ go(1); };
  document.getElementById('zPrev').onclick=function(){ go(-1); };
  document.getElementById('zNext').onclick=function(){ go(1); };
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); go(1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(-1); }
    else if(e.key==='Home'){ show(1); } else if(e.key==='End'){ show(TOTAL); }
  });
  // touch swipe
  var sx=null;
  book.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  book.addEventListener('touchend',function(e){
    if(sx===null)return; var dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>44){ go(dx<0?1:-1); } sx=null;
  },{passive:true});
})();
</script>
</body>
</html>
