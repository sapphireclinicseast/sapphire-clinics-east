<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Careers — Sapphire Clinics East, Inc.</title>
  <meta name="description" content="Apply for open positions at Sapphire Clinics East, Inc." />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .embed-frame { display: block; border: 0; width: 100vw; height: 100vh; }
    .fallback {
      display: none; padding: 48px 24px; max-width: 640px; margin: 0 auto; text-align: center; color: #1f2937;
    }
    .fallback h1 { font-size: 22px; margin: 0 0 12px; }
    .fallback a {
      display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 8px;
      background: #d97706; color: #fff; text-decoration: none; font-weight: 600;
    }
    @media (max-width: 600px) {
      .embed-frame { height: 100dvh; }
    }
  </style>
</head>
<body>
  <iframe
    class="embed-frame"
    src="https://hr.sapphireclinicseast.org/modules/hiring/apply"
    title="Sapphire Clinics East — Careers Application"
    allow="clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
    onerror="document.querySelector('.fallback').style.display='block';"></iframe>
  <noscript>
    <div class="fallback" style="display:block">
      <h1>Apply for a Career at Sapphire Clinics East</h1>
      <p>Open the application portal to continue.</p>
      <a href="https://hr.sapphireclinicseast.org/modules/hiring/apply">Open Careers Portal →</a>
    </div>
  </noscript>
  <div class="fallback" id="fallback">
    <h1>Apply for a Career at Sapphire Clinics East</h1>
    <p>If the application portal does not load below, open it directly:</p>
    <a href="https://hr.sapphireclinicseast.org/modules/hiring/apply" target="_blank" rel="noopener">Open Careers Portal →</a>
  </div>
</body>
</html>
