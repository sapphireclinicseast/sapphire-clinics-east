# ══════════════════════════════════════════════════════════════════
#  SAPPHIRE CLINICS EAST — Deploy to Netcup VPS
#
#  Runs automatically on every push to main (including CMS commits).
#  Replaces Netlify's build-and-deploy pipeline.
#
#  Required GitHub Secrets (Settings → Secrets → Actions):
#    VPS_HOST        — your Netcup VPS IP address
#    VPS_USER        — SSH username (usually root or debian)
#    VPS_SSH_KEY     — private SSH key (see setup guide in scripts/setup-vps.sh)
# ══════════════════════════════════════════════════════════════════

name: Deploy to Netcup VPS

on:
  # Re-enabled 2026-05-05 — origin/main has been brought to parity with
  # /opt/sapphire-marketing-hub/ (commits b604089, 4b7a740, 9be830a,
  # 0b62fab, 56482e8, 555fdbd). All marketing-hub source now lives in
  # git, so auto-deploys will no longer revert UI to a pre-rebrand state.
  #
  # OPERATIONAL RULE: do NOT edit /opt/sapphire-marketing-hub/ on the VPS
  # directly. Every change must go through git so the next deploy preserves
  # it instead of overwriting it. Hot-fix on the VPS only as an emergency,
  # and in that case immediately commit + push the same change to git.
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys to a single VPS host. Two parallel runs collide on the
# Next.js `.next` build-info lock and fail with "Another next build process
# is already running" (seen in PR #133 / #134 / #135). Queueing forces the
# second deploy to wait until the first finishes.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repo ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Build content indexes from CMS markdown files ─────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build content indexes
        run: node scripts/build-content.js

      # ── 3. Set up SSH key directly ───────────────────────────────
      - name: Set up SSH key
        continue-on-error: true   # ssh-keyscan failure must not cascade — run: steps already use -o StrictHostKeyChecking=no
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts || true

      # ── 4. Sync files to VPS (rsync — fast incremental updates) ──
      - name: Deploy files to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='.claude' \
            --exclude='*.sh' \
            --exclude='nginx.conf' \
            --exclude='COMPANY LOGO/node_modules' \
            --exclude='COMPANY LOGO/package*.json' \
            --exclude='COMPANY LOGO/capture-intro.mjs' \
            --exclude='api/node_modules' \
            --exclude='/data/' \
            --exclude='teletherapy/node_modules' \
            --exclude='teletherapy/.next' \
            --exclude='teletherapy/.next.new' \
            --exclude='teletherapy/.next.old' \
            --exclude='teletherapy/.env' \
            --exclude='teletherapy/uploads' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/sapphireclinicseast.org/

          # Stamp the deploy with the commit SHA. The Dockerfile's `COPY . .`
          # picks this up, so every distinct commit forces a real rebuild of
          # the source layer (and everything that depends on it) without
          # having to disable the rest of the BuildKit cache. Stops the
          # silent "1.7-second build" stale-image regressions cold.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo '${{ github.sha }}' > /var/www/sapphireclinicseast.org/.deploy-sha && \
             echo 'deploy-sha now: '$(cat /var/www/sapphireclinicseast.org/.deploy-sha)"

      # ── 5. Provision SSL for teletherapy subdomain (if needed) ──
      - name: Setup teletherapy SSL
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'if [ ! -d /etc/letsencrypt/live/teletherapy.sapphireclinicseast.org ]; then
               echo "→ Provisioning SSL for teletherapy.sapphireclinicseast.org..."
               certbot certonly --standalone --preferred-challenges http \
                 -d teletherapy.sapphireclinicseast.org \
                 --non-interactive --agree-tos \
                 -m admin@sapphireclinicseast.org \
                 --pre-hook "systemctl stop nginx" \
                 --post-hook "systemctl start nginx" \
                 && echo "✅ SSL cert obtained." \
                 || echo "⚠ SSL cert failed — will retry next deploy."
             else
               echo "✅ SSL cert already exists."
             fi'

      # ── 6. Provision SSL for accounting subdomain (if needed) ───
      - name: Setup accounting SSL
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'if [ ! -d /etc/letsencrypt/live/accounting.sapphireclinicseast.org ]; then
               echo "→ Provisioning SSL for accounting.sapphireclinicseast.org..."
               certbot certonly --standalone --preferred-challenges http \
                 -d accounting.sapphireclinicseast.org \
                 --non-interactive --agree-tos \
                 -m admin@sapphireclinicseast.org \
                 --pre-hook "systemctl stop nginx" \
                 --post-hook "systemctl start nginx" \
                 && echo "✅ SSL cert obtained." \
                 || echo "⚠ SSL cert failed — will retry next deploy."
             else
               echo "✅ SSL cert already exists for accounting."
             fi'

      # ── 6c. Provision SSL for staff subdomain (if needed) ───────
      # staff.sapphireclinicseast.org is the canonical staff-portal host
      # (migrated from teletherapy.*). scripts/nginx.conf references this
      # cert, so it must exist before `nginx -t` runs below.
      - name: Setup staff SSL
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'if [ ! -d /etc/letsencrypt/live/staff.sapphireclinicseast.org ]; then
               echo "→ Provisioning SSL for staff.sapphireclinicseast.org..."
               certbot certonly --standalone --preferred-challenges http \
                 -d staff.sapphireclinicseast.org \
                 --non-interactive --agree-tos \
                 -m admin@sapphireclinicseast.org \
                 --pre-hook "systemctl stop nginx" \
                 --post-hook "systemctl start nginx" \
                 && echo "✅ SSL cert obtained." \
                 || echo "⚠ SSL cert failed — will retry next deploy."
             else
               echo "✅ SSL cert already exists for staff."
             fi'

      # ── 6c. Provision SSL for scholarship subdomain (if needed) ─
      - name: Setup scholarship SSL
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'if [ ! -d /etc/letsencrypt/live/scholarship.sapphireclinicseast.org ]; then
               echo "→ Provisioning SSL for scholarship.sapphireclinicseast.org..."
               certbot certonly --standalone --preferred-challenges http \
                 -d scholarship.sapphireclinicseast.org \
                 --non-interactive --agree-tos \
                 -m admin@sapphireclinicseast.org \
                 --pre-hook "systemctl stop nginx" \
                 --post-hook "systemctl start nginx" \
                 && echo "✅ SSL cert obtained." \
                 || echo "⚠ SSL cert failed — will retry next deploy."
             else
               echo "✅ SSL cert already exists for scholarship."
             fi'

      # ── 6d. Provision SSL for fellowship subdomain (if needed) ──
      # fellowship.sapphireclinicseast.org is the new home of the UGAT hub
      # (moved off scholarship.*/ugatfellow). scripts/nginx.conf references
      # this cert, so it must exist before `nginx -t` runs below.
      - name: Setup fellowship SSL
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'if [ ! -d /etc/letsencrypt/live/fellowship.sapphireclinicseast.org ]; then
               echo "→ Provisioning SSL for fellowship.sapphireclinicseast.org..."
               certbot certonly --standalone --preferred-challenges http \
                 -d fellowship.sapphireclinicseast.org \
                 --non-interactive --agree-tos \
                 -m admin@sapphireclinicseast.org \
                 --pre-hook "systemctl stop nginx" \
                 --post-hook "systemctl start nginx" \
                 && echo "✅ SSL cert obtained." \
                 || echo "⚠ SSL cert failed — will retry next deploy."
             else
               echo "✅ SSL cert already exists for fellowship."
             fi'

      # ── 6. Update Nginx config & reload ─────────────────────────
      - name: Update Nginx config
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/nginx.conf \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/etc/nginx/sites-available/sapphireclinicseast.org
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "ln -sf /etc/nginx/sites-available/sapphireclinicseast.org /etc/nginx/sites-enabled/ && \
             rm -f /etc/nginx/sites-enabled/accounting.sapphireclinicseast.org && \
             rm -f /etc/nginx/sites-enabled/accounting && \
             nginx -t && systemctl reload nginx && echo '✅ Nginx reloaded.'"

      # ── 6b. Rebuild & restart the Marketing Hub Next.js container ────
      # Without this step, rsync-only deploys leave the running sapphire_app
      # image stale — file changes hit /var/www/... but the container keeps
      # serving the previously-baked image. This step rebuilds from the
      # freshly-synced source and recreates the container.
      - name: Rebuild & Restart Marketing Hub
        continue-on-error: true   # OOM-kill during build must not block Accounting Hub deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            # Deliberately NOT using `set -e` so we can capture build exit
            # codes and print diagnostics before bailing.
            DOCKER_DIR="/var/www/sapphireclinicseast.org/docker"
            ENV_FILE="/opt/sapphire/docker/.env.production"

            if [ ! -d "$DOCKER_DIR" ]; then
              echo "❌ Marketing hub docker dir not found at $DOCKER_DIR"
              exit 1
            fi
            if [ ! -f "$ENV_FILE" ]; then
              echo "❌ Marketing hub .env.production not found at $ENV_FILE"
              exit 1
            fi

            cd "$DOCKER_DIR"

            echo "→ Currently running marketing-hub container:"
            docker ps --filter "name=sapphire_app" --format "  {{.Names}}  image={{.Image}}  status={{.Status}}" || true

            # ─── Build-context fingerprint ──────────────────────────────
            # Sanity-check that the freshly rsync'd source on the VPS
            # actually contains the latest commit. If somebody (a backup
            # cron, a hand-edit, etc.) clobbered files between the rsync
            # and this point, the build below would happily bake the
            # stale content. Print the schedules layout sha so a
            # mismatch is visible in the run log.
            cd /var/www/sapphireclinicseast.org
            echo "→ Source-tree fingerprint (post-rsync):"
            echo "   src/app/schedules/layout.tsx:                   $(sha256sum 'src/app/schedules/layout.tsx' 2>/dev/null | awk '{print $1}' | cut -c1-16) ($(wc -c < 'src/app/schedules/layout.tsx' 2>/dev/null) bytes)"
            echo "   src/app/schedules/page.tsx:                     $(sha256sum 'src/app/schedules/page.tsx' 2>/dev/null | awk '{print $1}' | cut -c1-16)"
            echo "   src/app/schedules/[branch]/[dept]/page.tsx:     $(sha256sum 'src/app/schedules/[branch]/[dept]/page.tsx' 2>/dev/null | awk '{print $1}' | cut -c1-16)"
            echo "   src/middleware.ts:                              $(sha256sum 'src/middleware.ts' 2>/dev/null | awk '{print $1}' | cut -c1-16)"
            cd "$DOCKER_DIR"

            echo "→ Tagging current image as :rollback (best-effort)..."
            docker tag sapphire_app:latest sapphire_app:rollback 2>/dev/null || true

            echo "→ Building sapphire_app from /var/www/sapphireclinicseast.org..."
            # The .deploy-sha file written during rsync (one line, the
            # current commit SHA) is part of the build context. Each new
            # commit changes its content, which invalidates BuildKit's
            # cache for the COPY layer and everything downstream — so we
            # get a real rebuild without paying the full --no-cache tax
            # on layers that genuinely haven't changed (base image,
            # node_modules install, etc.).
            docker compose --env-file "$ENV_FILE" build --pull app
            BUILD_RC=$?
            echo "   Build exit code: $BUILD_RC"
            if [ "$BUILD_RC" != "0" ]; then
              echo "❌ Build failed — leaving previous container untouched."
              exit 1
            fi
            echo "   ✅ Image built."

            echo "→ Pre-flight: ensuring sapphire_db is healthy before recreating app..."
            DB_OK="no"
            for i in 1 2 3 4 5 6; do
              if docker exec sapphire_db pg_isready -U sapphire -d sapphire_marketing >/dev/null 2>&1; then
                DB_OK="yes"; break
              fi
              echo "   sapphire_db not ready (attempt $i/6) — waiting 5s..."
              sleep 5
            done
            if [ "$DB_OK" != "yes" ]; then
              echo "   sapphire_db still unhealthy — restarting it..."
              docker compose --env-file "$ENV_FILE" up -d postgres 2>&1 || true
              sleep 12
            fi

            echo "→ Ensuring upload subdirs are writable by the nextjs container user (uid 1001)..."
            mkdir -p /opt/sapphire/uploads/queue-ads
            chown 1001:1001 /opt/sapphire/uploads/queue-ads

            echo "→ Recreating sapphire_app container (--no-deps, skip dep wait)..."
            # --no-deps avoids tearing down or waiting on postgres/redis when only
            # the app changed. If postgres is briefly unhealthy mid-deploy, this
            # keeps the rebuild from leaving sapphire_app DOWN (502 on nginx).
            docker compose --env-file "$ENV_FILE" up -d --force-recreate --no-deps app
            UP_RC=$?
            if [ "$UP_RC" != "0" ]; then
              echo "❌ Container recreate failed (exit $UP_RC)."
              echo "→ Attempting fallback: start app with previous image..."
              docker compose --env-file "$ENV_FILE" up -d --no-deps app 2>&1 || true
              exit 1
            fi

            echo "→ Waiting 25s for app to stabilize..."
            sleep 25

            echo "→ Health check on http://localhost:3000/..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>&1 || echo "000")
            echo "   HTTP $HTTP_CODE"

            echo "→ Container logs (last 30 lines):"
            docker logs sapphire_app --tail 30 2>&1 || true

            if [ "$HTTP_CODE" = "000" ]; then
              echo "❌ Marketing Hub did not come up on port 3000"
              exit 1
            fi

            # ─── Post-deploy verification ───────────────────────────────
            # Fetch the schedules gate from the running container and check
            # that the rebrand markers are present (no orange palette, no
            # broken sandbox-clinic logo). If a stale image somehow ended
            # up running, fail the workflow loudly here rather than letting
            # a silent regression reach end users.
            echo "→ Verifying rebrand markers on rendered /schedules..."
            BODY=$(curl -s -L --max-time 10 -H 'Host: schedules.sapphireclinicseast.org' \
              http://localhost:3000/schedules 2>/dev/null || echo '')
            HAS_NARRA=$(echo "$BODY" | grep -c '#1B3F38' || true)
            HAS_PAPER=$(echo "$BODY" | grep -c '#F5F0E8' || true)
            HAS_ORANGE=$(echo "$BODY" | grep -c '#ED6823' || true)
            HAS_LOGO=$(echo "$BODY" | grep -c 'sandbox-clinic-logo' || true)
            echo "   #1B3F38 (Narra):           $HAS_NARRA hits"
            echo "   #F5F0E8 (Paper):           $HAS_PAPER hits"
            echo "   #ED6823 (legacy orange):   $HAS_ORANGE hits   (must be 0)"
            echo "   sandbox-clinic-logo:       $HAS_LOGO hits     (must be 0)"
            if [ "$HAS_ORANGE" != "0" ] || [ "$HAS_LOGO" != "0" ]; then
              echo "❌ Stale image detected — running container still serves the orange/logo layout."
              echo "   This usually means the docker build cache short-circuited the rebuild."
              echo "   Image-layer history of running container:"
              docker inspect --format '{{.Image}}' sapphire_app | xargs -I{} docker history --no-trunc {} 2>&1 | head -20 || true
              exit 1
            fi
            echo "   ✅ Rebrand markers present — running image is fresh."

            echo ""
            echo "✅ Marketing Hub rebuilt & restarted (HTTP $HTTP_CODE)."

      # ── 6c. Rebuild & restart the Class Portal Next.js container ─────
      # The class-portal source lives in /opt/sapphire/class-portal (not in
      # the rsync target). Without this step, edits under class-portal/ in
      # PRs against main never reach class.sapphireclinicseast.org. We pull
      # main, stash any VPS-local hot-fixes (e.g. src/app/api/upload/route.ts
      # — the team intentionally keeps a local version), then rebuild.
      - name: Rebuild & Restart Class Portal
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set +e
            CLASS_REPO="/opt/sapphire"
            ENV_FILE="/opt/sapphire/docker/.env.production"

            if [ ! -d "$CLASS_REPO/class-portal" ]; then
              echo "⚠ Class portal source not found at $CLASS_REPO/class-portal — skipping."
              exit 0
            fi

            cd "$CLASS_REPO"
            echo "→ Stashing any VPS-local edits before pull..."
            git stash push -m "auto-deploy-$(date +%Y%m%d-%H%M%S)" 2>&1 | tail -3 || true

            echo "→ Pulling latest main into $CLASS_REPO..."
            git fetch origin main 2>&1 | tail -3
            git reset --hard origin/main 2>&1 | tail -3

            echo "→ Restoring stashed local edits (if any)..."
            git stash pop 2>&1 | tail -3 || echo "   (no stash to pop or non-fatal conflict — VPS-local hot-fixes preserved in stash)"

            echo "→ Currently running class-portal container:"
            docker ps --filter "name=sapphire_class_portal" --format "  {{.Names}}  image={{.Image}}  status={{.Status}}" || true

            echo "→ Rebuilding class-portal image..."
            # `tail -5` reset $?, so we used to recreate the container even
            # when docker compose failed. Read PIPESTATUS[0] instead so we
            # actually catch a failed build and bail.
            docker compose -f /opt/sapphire/docker/docker-compose.yml --env-file "$ENV_FILE" build --pull class-portal 2>&1 | tail -30
            BUILD_RC=${PIPESTATUS[0]}
            if [ "$BUILD_RC" != "0" ]; then
              echo "❌ class-portal build failed (exit $BUILD_RC) — leaving previous container untouched."
              exit 1
            fi

            echo "→ Recreating sapphire_class_portal container..."
            docker compose -f /opt/sapphire/docker/docker-compose.yml --env-file "$ENV_FILE" up -d --force-recreate --no-deps class-portal 2>&1 | tail -5

            echo "→ Waiting 15s for class-portal to stabilize..."
            sleep 15

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3006/ 2>&1 || echo "000")
            echo "   HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "000" ]; then
              echo "❌ Class portal did not come up on port 3006"
              docker logs sapphire_class_portal --tail 30 2>&1 || true
              exit 1
            fi

            echo "✅ Class Portal rebuilt & restarted (HTTP $HTTP_CODE)."

      # ── 6. Install survey API deps & start/restart ─────────────────
      - name: Setup & Restart Survey API
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'mkdir -p /var/www/sapphireclinicseast.org/data && \
             cd /var/www/sapphireclinicseast.org/api && \
             npm install --production && \
             if pm2 describe scei-survey >/dev/null 2>&1; then \
               pm2 restart scei-survey; \
             else \
               SURVEY_API_KEY=${SURVEY_API_KEY:-SCEI_SURVEY_KEY_2025} pm2 start survey-api.js --name scei-survey && pm2 save; \
             fi && \
             if [ ! -f /var/www/sapphireclinicseast.org/data/surveys.db ]; then \
               node seed-data.js; \
             fi'

      # ── 8. Deploy Teletherapy app ──────────────────────────────
      - name: Deploy Teletherapy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' << 'REMOTE_SCRIPT'
          set -e
          TELE_DIR="/var/www/sapphireclinicseast.org/teletherapy"
          if [ ! -d "$TELE_DIR" ]; then echo "⚠ Teletherapy dir not found, skipping."; exit 0; fi
          cd "$TELE_DIR"

          # Always recreate .env to ensure correct DATABASE_URL
          if true; then
            echo "→ Creating teletherapy .env..."
            MENV="/opt/sapphire/docker/.env.production"
            if [ -f "$MENV" ]; then
              PG_PASS=$(grep "^POSTGRES_PASSWORD" "$MENV" | cut -d= -f2-)
              DB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' sapphire_db 2>/dev/null || echo "localhost")
              echo "DATABASE_URL=postgresql://sapphire:${PG_PASS}@${DB_IP}:5432/sapphire_marketing" > .env
              echo "→ DB host: ${DB_IP}"
              grep "^NEXTAUTH_SECRET" "$MENV" >> .env
              echo "NEXTAUTH_URL=https://staff.sapphireclinicseast.org" >> .env
              echo "AUTH_TRUST_HOST=true" >> .env
              grep "^GOOGLE_CLIENT_ID" "$MENV" >> .env 2>/dev/null || true
              grep "^GOOGLE_CLIENT_SECRET" "$MENV" >> .env 2>/dev/null || true
              grep "^GOOGLE_REDIRECT_URI" "$MENV" >> .env 2>/dev/null || true
              grep "^GOOGLE_REFRESH_TOKEN" "$MENV" >> .env 2>/dev/null || true
              # Service account for Gmail domain-wide delegation — lets the staff
              # portal send patient reports AS the branch address (east@/greenhills@)
              # with no per-address "Send mail as" alias. Optional: if absent, sends
              # fall back to the refresh-token mailbox. Add it to $MENV to enable.
              grep "^GOOGLE_SERVICE_ACCOUNT_KEY" "$MENV" >> .env 2>/dev/null || true
              # Shared secret to mint clinician HOST meet links (record button)
              grep "^MEET_LINK_SECRET" "$MENV" >> .env 2>/dev/null || true
              # Shared external-API key: the Accounting Hub reads mentorship
              # meetings (and marks them Paid) through /api/external/* with it.
              grep "^EXTERNAL_API_KEY" "$MENV" >> .env 2>/dev/null || true
              grep "^MEET_BASE_URL" "$MENV" >> .env 2>/dev/null || true
              grep "^GMAIL_FROM_EMAIL" "$MENV" >> .env 2>/dev/null || true
              # Shared secret for the provider sign-in/up handoff from the patient app.
              grep "^PROVIDER_HANDOFF_SECRET" "$MENV" >> .env 2>/dev/null || true
              echo "UPLOAD_DIR=./uploads" >> .env
              echo "TELETHERAPY_HR_API_KEY=${{ secrets.TELETHERAPY_HR_API_KEY }}" >> .env
              # Manual chatbot (Phase 2) — key lives in the marketing .env.production
              grep "^ANTHROPIC_API_KEY" "$MENV" >> .env 2>/dev/null || true
              grep "^ANTHROPIC_MODEL" "$MENV" >> .env 2>/dev/null || true
            else
              echo "DATABASE_URL=postgresql://sapphire:sapphire@localhost:5433/sapphire_marketing" > .env
              echo "NEXTAUTH_URL=https://staff.sapphireclinicseast.org" >> .env
              echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> .env
              echo "AUTH_TRUST_HOST=true" >> .env
              echo "UPLOAD_DIR=./uploads" >> .env
              echo "TELETHERAPY_HR_API_KEY=${{ secrets.TELETHERAPY_HR_API_KEY }}" >> .env
              grep "^EXTERNAL_API_KEY" "$MENV" >> .env 2>/dev/null || true
            fi
            echo "✅ .env created."
          fi

          mkdir -p uploads/session-notes

          echo "→ Installing dependencies..."
          # No pipefail in this script, so `npm ci | tail -3` used to swallow
          # a failed/partial install and let the deploy continue on a broken
          # node_modules. Log to a file and check the exit code instead,
          # matching the later `npm install --include=dev` block.
          if ! npm ci --production=false > /tmp/tt-ci.log 2>&1; then
            echo "⚠ npm ci failed — clearing npm cache + node_modules and retrying."
            echo "   (heals a corrupted install, e.g. a dangling napi-postinstall"
            echo "    symlink whose target is missing — see"
            echo "    project_teletherapy_deploy_corrupted_node_modules)"
            tail -20 /tmp/tt-ci.log
            npm cache clean --force > /dev/null 2>&1 || true
            rm -rf node_modules
            if ! npm ci --production=false > /tmp/tt-ci.log 2>&1; then
              echo "⚠ npm ci still failing after clean — last resort: fresh npm install."
              rm -rf node_modules
              if ! npm install --no-audit --no-fund > /tmp/tt-ci.log 2>&1; then
                echo "❌ FATAL: install failed even after a clean reinstall — last 20 lines:"
                tail -20 /tmp/tt-ci.log
                exit 1
              fi
            fi
          fi
          echo "   ✓ dependencies installed ($(wc -l < /tmp/tt-ci.log) log lines)"

          echo "→ Generating Prisma client..."
          npx prisma generate 2>&1 | tail -2

          # A partial `prisma generate` (transient npm/engine state) leaves the
          # query compiler missing, so EVERY DB query — including login — 500s
          # while the deploy still reports green. Verify the compiler exists and
          # self-heal: regenerate, then reinstall prisma packages if still gone.
          QC="node_modules/.prisma/client/query_compiler_fast_bg.js"
          if [ ! -f "$QC" ]; then
            echo "⚠ Prisma client incomplete (query compiler missing) — regenerating..."
            npx prisma generate 2>&1 | tail -2
          fi
          if [ ! -f "$QC" ]; then
            echo "⚠ Still incomplete — reinstalling prisma packages and regenerating..."
            npm install @prisma/client prisma @prisma/adapter-pg 2>&1 | tail -3
            npx prisma generate 2>&1 | tail -2
          fi
          if [ ! -f "$QC" ]; then
            echo "⚠ Query compiler STILL missing — full clean reinstall (rm -rf node_modules) + regenerate, last resort."
            npm cache clean --force > /dev/null 2>&1 || true
            rm -rf node_modules
            npm install --no-audit --no-fund > /tmp/tt-reinstall.log 2>&1 || tail -20 /tmp/tt-reinstall.log
            npx prisma generate 2>&1 | tail -2
          fi
          if [ ! -f "$QC" ]; then
            echo "❌ FATAL: Prisma client query compiler still missing — leaving the previous (working) container up instead of serving a broken client."
            exit 1
          fi

          # Run 33260138940 (2026-08-29): the middle rung's targeted
          # `npm install @prisma/client prisma @prisma/adapter-pg` left
          # @prisma/client itself half-installed (its package.json missing).
          # The QC file check above still passed, but `next build` then failed
          # typecheck with "Module '@prisma/client' has no exported member
          # 'PrismaClient'". So also verify the package is actually loadable —
          # not just that the generated compiler file exists — and fall through
          # to the same last-resort full clean reinstall if it isn't.
          PKG_OK='require.resolve("@prisma/client/package.json"); require("@prisma/client")'
          if ! node -e "$PKG_OK" > /dev/null 2>&1; then
            echo "⚠ @prisma/client package broken (half-installed) — full clean reinstall (rm -rf node_modules) + regenerate, last resort."
            npm cache clean --force > /dev/null 2>&1 || true
            rm -rf node_modules
            npm install --no-audit --no-fund > /tmp/tt-reinstall.log 2>&1 || tail -20 /tmp/tt-reinstall.log
            npx prisma generate 2>&1 | tail -2
          fi
          if [ ! -f "$QC" ] || ! node -e "$PKG_OK" > /dev/null 2>&1; then
            echo "❌ FATAL: @prisma/client still broken after clean reinstall — leaving the previous (working) container up instead of serving a broken client."
            exit 1
          fi
          echo "   ✓ Prisma client verified (query compiler present, @prisma/client loadable)"

          echo "→ Creating teletherapy tables..."
          cat prisma/setup.sql | docker exec -i sapphire_db psql -U sapphire -d sapphire_marketing 2>&1 || true

          echo "→ Applying Prisma migrations to sapphire_marketing..."
          # The dockerized "migrate" service isn't part of this deploy step,
          # and historically migrations have had to be applied by hand on
          # the VPS. Replay every migration.sql in order — they all use
          # CREATE TABLE IF NOT EXISTS / ADD COLUMN IF NOT EXISTS guards
          # so re-running is idempotent. Failures are logged but non-fatal
          # so a single bad migration doesn't break unrelated deploys.
          MIGRATION_DIR="/var/www/sapphireclinicseast.org/prisma/migrations"
          for sql_file in $(ls -d "$MIGRATION_DIR"/*/ 2>/dev/null | sort); do
            mig_name=$(basename "$sql_file")
            sql="$sql_file/migration.sql"
            [ -f "$sql" ] || continue
            echo "  ↳ $mig_name"
            cat "$sql" | docker exec -i sapphire_db psql -U sapphire -d sapphire_marketing -q -v ON_ERROR_STOP=0 2>&1 | tail -3
          done
          echo "✅ Marketing-hub migrations applied."

          # (The authoritative atomic build happens later, after npm install —
          # see "Building teletherapy Next.js app". A second in-place build here
          # only risked corrupting the live .next, so it was removed.)

          echo "→ Updating docker-compose and ensuring postgres is up..."
          cp /var/www/sapphireclinicseast.org/docker/docker-compose.yml /opt/sapphire/docker/docker-compose.yml 2>/dev/null || true
          # Plain `up -d` (no --force-recreate): compose only recreates postgres
          # when its config actually changed. Force-recreating on EVERY deploy
          # restarted the DB mid-deploy while the app was already serving,
          # causing a window of P1001 "Can't reach database server" errors —
          # pages like Settings → Team Members rendered as if all data was gone.
          cd /opt/sapphire/docker && docker compose --env-file .env.production up -d postgres 2>&1 | tail -3 || true
          sleep 5
          echo "→ Verifying postgres port..."
          pg_isready -h localhost -p 5432 2>&1 || echo "⚠ pg_isready not available, checking with docker..."
          docker exec sapphire_db pg_isready -U sapphire 2>&1 | tail -1

          echo "→ Seeding main admin account..."
          docker exec sapphire_db psql -U sapphire -d sapphire_marketing -c "
            ALTER TABLE \"TherapistAccount\" ADD COLUMN IF NOT EXISTS \"resetToken\" TEXT;
            ALTER TABLE \"TherapistAccount\" ADD COLUMN IF NOT EXISTS \"resetTokenExpiry\" TIMESTAMP(3);
            ALTER TABLE \"TherapistAccount\" ADD COLUMN IF NOT EXISTS \"lastPlainPassword\" TEXT;

            -- Add isInitialEvaluation flag to SessionNote
            ALTER TABLE \"SessionNote\" ADD COLUMN IF NOT EXISTS \"isInitialEvaluation\" BOOLEAN NOT NULL DEFAULT false;

            -- Create PatientDocumentType enum + PatientDocument table
            DO \$\$ BEGIN
              CREATE TYPE \"PatientDocumentType\" AS ENUM ('INITIAL_EVALUATION', 'PROGRESS_REPORT', 'OTHER_DOCUMENT');
            EXCEPTION WHEN duplicate_object THEN null;
            END \$\$;
            CREATE TABLE IF NOT EXISTS \"PatientDocument\" (
              id TEXT PRIMARY KEY,
              \"patientId\" TEXT NOT NULL,
              \"uploadedById\" TEXT NOT NULL,
              department TEXT NOT NULL,
              \"documentType\" \"PatientDocumentType\" NOT NULL,
              \"fileName\" TEXT NOT NULL,
              \"filePath\" TEXT NOT NULL,
              \"mimeType\" TEXT NOT NULL,
              description TEXT,
              \"scheduleId\" TEXT,
              \"createdAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              \"updatedAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP
            );
            CREATE INDEX IF NOT EXISTS \"PatientDocument_patientId_department_idx\" ON \"PatientDocument\"(\"patientId\", department);
            CREATE INDEX IF NOT EXISTS \"PatientDocument_documentType_idx\" ON \"PatientDocument\"(\"documentType\");

            -- IE/PR workflow tracking columns on PatientDocument
            ALTER TABLE \"PatientDocument\" ADD COLUMN IF NOT EXISTS \"sentToPatientAt\" TIMESTAMP(3);
            ALTER TABLE \"PatientDocument\" ADD COLUMN IF NOT EXISTS \"sentToPatientBy\" TEXT;
            ALTER TABLE \"PatientDocument\" ADD COLUMN IF NOT EXISTS \"sentToPatientCc\" TEXT;
            ALTER TABLE \"PatientDocument\" ADD COLUMN IF NOT EXISTS \"informedFrontDeskAt\" TIMESTAMP(3);
            ALTER TABLE \"PatientDocument\" ADD COLUMN IF NOT EXISTS \"informedById\" TEXT;
            ALTER TABLE \"PatientDocument\" ADD COLUMN IF NOT EXISTS \"paidForAt\" TIMESTAMP(3);
            ALTER TABLE \"PatientDocument\" ADD COLUMN IF NOT EXISTS \"paidById\" TEXT;
            ALTER TABLE \"PatientDocument\" ADD COLUMN IF NOT EXISTS \"emailedToPatientAt\" TIMESTAMP(3);
            ALTER TABLE \"PatientDocument\" ADD COLUMN IF NOT EXISTS \"emailedById\" TEXT;
            CREATE INDEX IF NOT EXISTS \"PatientDocument_informedFrontDeskAt_idx\" ON \"PatientDocument\"(\"informedFrontDeskAt\");
            CREATE INDEX IF NOT EXISTS \"PatientDocument_emailedToPatientAt_idx\" ON \"PatientDocument\"(\"emailedToPatientAt\");

            -- BranchCCEmail table for per-branch IE cc emails
            CREATE TABLE IF NOT EXISTS \"BranchCCEmail\" (
              id TEXT PRIMARY KEY,
              branch TEXT NOT NULL UNIQUE,
              email TEXT NOT NULL,
              notes TEXT,
              \"updatedById\" TEXT,
              \"createdAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              \"updatedAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP
            );

            -- Create a system admin staff record if it doesn't exist
            INSERT INTO \"Staff\" (id, \"firstName\", \"lastName\", department, branch, \"createdAt\", \"updatedAt\")
            VALUES ('system-admin-staff', 'System', 'Administrator', 'ADMINISTRATION', 'SBEA', NOW(), NOW())
            ON CONFLICT (id) DO NOTHING;

            -- Free Hannah Jara's staffId if the admin was previously linked to her
            UPDATE \"TherapistAccount\" SET \"staffId\" = 'system-admin-staff'
            WHERE id = 'clmainadmin01' AND \"staffId\" != 'system-admin-staff';

            -- Create admin account if it doesn't exist (preserve password if already set)
            INSERT INTO \"TherapistAccount\" (id, \"staffId\", email, \"passwordHash\", \"lastPlainPassword\", role, \"isActive\", \"createdAt\", \"updatedAt\")
            VALUES ('clmainadmin01', 'system-admin-staff', 'main@sapphireclinicseast.org',
                   '\$2b\$12\$fwLq6pRpTGyAYKxAVijFx.6xlKsvqdWDPAoWwQFMLWUCvcpOlUewW',
                   'teletherapy2026',
                   'ADMIN', true, NOW(), NOW())
            ON CONFLICT (id) DO UPDATE SET
              email = EXCLUDED.email,
              \"passwordHash\" = EXCLUDED.\"passwordHash\",
              \"lastPlainPassword\" = EXCLUDED.\"lastPlainPassword\",
              role = 'ADMIN',
              \"isActive\" = true;
          " && echo "✅ Main admin seeded." || echo "⚠ Admin seed failed."

          cd /var/www/sapphireclinicseast.org/teletherapy

          # Install + build BEFORE restarting — pm2 just runs `next start`
          # against the existing .next/, which would otherwise serve a stale
          # compiled CSS/JS (the old brand palette stayed visible for days
          # because of this). --include=dev forces dev dependencies even if
          # the runner's NODE_ENV is production. Pipe to a log file so the
          # build doesn't silently start on an incomplete install.
          echo "→ Installing teletherapy deps..."
          if ! npm install --include=dev --no-audit --no-fund > /tmp/tt-install.log 2>&1; then
            echo "❌ npm install failed — last 20 lines:"
            tail -20 /tmp/tt-install.log
            exit 1
          fi
          echo "   ✓ install OK ($(wc -l < /tmp/tt-install.log) log lines)"
          if [ ! -x node_modules/.bin/next ]; then
            echo "❌ FATAL: node_modules/.bin/next missing after install"
            ls node_modules/.bin/ 2>&1 | head -20
            exit 1
          fi

          # Sanity check + self-heal: an install can exit 0 and still leave a
          # broken/partial node_modules (transient VPS npm state — run
          # 30818464332 failed with "Can't resolve 'lucide-react'" across
          # ~15 teletherapy files on a commit that never touched teletherapy).
          # Verify key deps actually resolve before spending minutes on a
          # build; if they don't, rebuild node_modules from scratch.
          tt_self_heal() {
            echo "⚠ node_modules unhealthy — self-healing (cache verify + fresh install)..."
            npm cache verify > /tmp/tt-cache.log 2>&1 || npm cache clean --force > /tmp/tt-cache.log 2>&1 || true
            rm -rf node_modules
            if ! npm install --include=dev --no-audit --no-fund > /tmp/tt-reinstall.log 2>&1; then
              echo "❌ recovery npm install failed — last 20 lines:"
              tail -20 /tmp/tt-reinstall.log
              exit 1
            fi
            echo "   ✓ recovery install OK"
          }
          echo "→ Sanity-checking key deps resolve..."
          node -e "require.resolve('lucide-react'); require.resolve('next')" 2>/dev/null || tt_self_heal
          if ! node -e "require.resolve('lucide-react'); require.resolve('next')"; then
            echo "❌ FATAL: key deps still unresolvable after fresh install"
            exit 1
          fi
          echo "   ✓ deps resolve"

          # ATOMIC BUILD — build into a staging dir (.next.new) and swap it in
          # only once it's complete. The running app keeps serving the live
          # .next throughout, so a concurrent or cancelled CI build can no
          # longer leave the portal with a half-written .next (the cause of the
          # intermittent 500 "Internal Server Error" / 502 during deploy storms).
          # If the build fails on missing modules anyway, self-heal and retry once.
          # Heap headroom, same reason as accounting-hub/docker/Dockerfile (#570):
          # Node's default old-space cap in this environment is ~2GB, and a Next
          # build of this size can exceed it and die with "Ineffective
          # mark-compacts near heap limit". That is a V8 ceiling, not host memory
          # pressure — the box has 7.8G RAM and 10G swap — so the fix is to raise
          # the cap rather than to shrink the build. Set explicitly here so the
          # teletherapy build cannot hit the wall the accounting build already hit.
          echo "→ Building teletherapy Next.js app (atomic → .next.new)..."
          tt_build_ok=false
          for tt_attempt in 1 2; do
            rm -rf .next.new
            if NODE_OPTIONS=--max-old-space-size=4096 NEXT_DIST_DIR=.next.new NEXT_TELEMETRY_DISABLED=1 npm run build > /tmp/tt-build.log 2>&1; then
              tt_build_ok=true
              break
            fi
            if [ "$tt_attempt" = "1" ] && grep -q "Module not found" /tmp/tt-build.log; then
              echo "⚠ build failed with missing modules — self-healing and retrying once..."
              grep "Module not found" /tmp/tt-build.log | sort -u | head -10
              tt_self_heal
              continue
            fi
            break
          done
          if [ "$tt_build_ok" != "true" ]; then
            # tail -30 used to cut off the "Module not found: Can't resolve 'X'"
            # lines, leaving only the trailing stack frames — surface them
            # explicitly and keep a longer tail.
            echo "❌ npm run build failed — 'Module not found' lines (if any):"
            grep -n "Module not found" /tmp/tt-build.log | head -20 || true
            echo "❌ last 80 lines of build log:"
            tail -80 /tmp/tt-build.log
            rm -rf .next.new
            exit 1
          fi
          if [ ! -f .next.new/BUILD_ID ]; then
            echo "❌ build exited 0 but .next.new/BUILD_ID missing — not swapping"
            rm -rf .next.new
            exit 1
          fi
          echo "   ✓ build OK — swapping .next.new → .next"
          rm -rf .next.old
          mv .next .next.old 2>/dev/null || true
          mv .next.new .next
          rm -rf .next.old

          echo "→ Restarting teletherapy app..."
          pm2 delete scei-teletherapy 2>/dev/null || true
          PORT=3002 HOSTNAME=0.0.0.0 pm2 start npm --name scei-teletherapy -- start && pm2 save

          echo "→ Waiting 10s for app to stabilize..."
          sleep 10

          echo "→ PM2 status:"
          pm2 list 2>&1

          echo "→ PM2 logs (last 30 lines):"
          pm2 logs scei-teletherapy --lines 30 --nostream 2>&1 || true

          echo "→ Checking port 3002:"
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3002/ 2>&1 || echo "curl failed"

          echo ""
          echo "✅ Teletherapy deployed."

          # ── Rebuild + restart client-portal Docker container ──────────
          # Same problem as teletherapy: rsync updates the source on disk
          # but the running container keeps serving the previous build.
          # `docker compose build client-portal && up -d` swaps the image.
          echo "→ Rebuilding client-portal Docker image..."
          cd /opt/sapphire
          ENV_FILE="/opt/sapphire/docker/.env"
          if [ ! -f "$ENV_FILE" ]; then ENV_FILE="/opt/sapphire/docker/.env.production"; fi
          docker compose -f /opt/sapphire/docker/docker-compose.yml --env-file "$ENV_FILE" build client-portal 2>&1 | tail -15
          echo "→ Restarting client-portal container..."
          docker compose -f /opt/sapphire/docker/docker-compose.yml --env-file "$ENV_FILE" up -d --no-deps client-portal 2>&1 | tail -5
          echo "→ Waiting 6s for client-portal to stabilize..."
          sleep 6
          echo "→ Checking port 3005:"
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3005/ 2>&1 || echo "curl failed"
          echo ""
          echo "✅ Client-portal deployed."

          # ── Rebuild + restart Nickel (standalone homecare app, own DB) ──
          echo "→ Deploying Nickel..."
          cd /opt/sapphire
          git checkout origin/main -- nickel docker 2>/dev/null || true
          # Sync Nickel's schema to its OWN database (idempotent) before restart.
          NICKEL_DB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' sapphire_db 2>/dev/null || echo "")
          NICKEL_PG_PASS=$(grep "^POSTGRES_PASSWORD" "$ENV_FILE" | cut -d= -f2-)
          if [ -n "$NICKEL_DB_IP" ] && [ -d /opt/sapphire/nickel ]; then
            docker exec sapphire_db psql -U sapphire -d sapphire_marketing -tc "SELECT 1 FROM pg_database WHERE datname='sapphire_nickel'" | grep -q 1 || docker exec sapphire_db psql -U sapphire -d sapphire_marketing -c "CREATE DATABASE sapphire_nickel"
            (cd /opt/sapphire/nickel && npm install --no-audit --no-fund >/dev/null 2>&1 && DATABASE_URL="postgresql://sapphire:${NICKEL_PG_PASS}@${NICKEL_DB_IP}:5432/sapphire_nickel" ./node_modules/.bin/prisma db push 2>&1 | tail -3) || echo "⚠ nickel db push skipped"
          fi
          docker compose -f /opt/sapphire/docker/docker-compose.yml --env-file "$ENV_FILE" build nickel 2>&1 | tail -15
          docker compose -f /opt/sapphire/docker/docker-compose.yml --env-file "$ENV_FILE" up -d --no-deps nickel 2>&1 | tail -5
          sleep 6
          echo "→ Checking port 3007:"
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3007/ 2>&1 || echo "curl failed"
          echo ""
          echo "✅ Nickel deployed."
          REMOTE_SCRIPT

      # ── 7b. Emergency accounting-hub container recovery ─────────────
      # Runs ALWAYS (even if marketing-hub build OOM-killed above) so that
      # the accounting hub comes back up immediately without waiting for a
      # full rebuild.  A full rebuild happens in step 8 right after.
      - name: Restart Accounting Hub (fast recovery)
        if: always()
        continue-on-error: true   # timeout must not block the full rebuild in step 8
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "→ Fast recovery: start accounting_app from existing image (no build)..."
            # `docker start` is the fastest path — directly restarts a stopped container
            # without going through compose dependency checks or image pulls.
            if docker start accounting_app 2>&1; then
              echo "   docker start accounting_app: OK"
            else
              echo "   docker start failed (container may not exist yet) — trying compose --no-build..."
              cd "/opt/accounting/docker"
              docker compose up -d --no-recreate --no-build app 2>&1 \
                || echo "   --no-build also failed — step 8 full rebuild will handle this."
            fi
            sleep 8
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ 2>&1 || echo "000")
            echo "   accounting_app health: HTTP $HTTP"

      # ── 8. Deploy Accounting Hub (Docker) ────────────────────────
      # RE-ENABLED 2026-08-20 (was `if: false` from 2026-08-17).
      #
      # It was disabled because it rsynced origin/main over /opt/accounting and
      # reverted approved production work that existed only on the server. That
      # premise has been removed rather than worked around: PR #567 merged
      # server-fixes-20260816 into main, and /opt/accounting was verified to
      # contain no file absent from main. Its stated reason — main "missing the
      # INVESTOR Role" — was already untrue when written (42c526bc, 2026-08-16).
      #
      # Note the consequence of leaving it off: deploy runs reported success
      # because this step was SKIPPED, not run, so nothing merged to main
      # reached the live Accounting Hub for three days.
      - name: Deploy Accounting Hub
        # Do not let an unrelated app's failure skip this step. On 2026-08-20
        # "Deploy Teletherapy" exited 1 (its Prisma client would not resolve, so
        # it correctly refused to serve a broken client) and this step was
        # SKIPPED as a result — the accounting hub stayed on old code because a
        # different app failed. The neighbouring "Restart Accounting Hub (fast
        # recovery)" step already carries if: always() for the same reason.
        # !cancelled() runs on earlier failure but still honours a cancelled run.
        if: ${{ !cancelled() }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Every neighbouring SSH step sets this; this one did not, so it died
          # at the 600s default on cold builds (a full Next build here is slow).
          command_timeout: 30m
          script: |
            set -eo pipefail
            ACCT_DIR="/opt/sapphire-marketing-hub"
            # DEPLOY_DIR is the AUTHORITATIVE location for the running accounting hub.
            # All docker compose operations MUST use this path and its .env file.
            # NEVER run docker compose from $ACCT_DIR/accounting-hub/docker — that
            # directory uses .env.production and a different compose project name,
            # which causes container hijacking and credential mismatches.
            DEPLOY_DIR="/opt/accounting"
            DOCKER_DIR="$DEPLOY_DIR/docker"
            GOLDEN="/var/lib/accounting-golden"

            # ── Hold the source-guard lock for the whole deploy ────────────
            # /usr/local/bin/scei-accounting-source-guard.sh runs every minute and
            # restores src/ and prisma/ from $GOLDEN whenever its fingerprint
            # strings go missing. An rsync that transiently removes a fingerprinted
            # file would trip it mid-deploy. The guard takes `flock -n 9` on this
            # lock, so holding it here makes the guard skip instead of fighting us.
            # The lock releases automatically when this shell exits, including on
            # failure.
            exec 9>/var/run/scei-accounting-source-guard.lock
            if flock -w 120 9; then
              echo "→ Source-guard lock held for the duration of this deploy."
            else
              echo "❌ Could not acquire the source-guard lock within 120s — aborting"
              echo "   rather than racing the guard. Check for a stuck guard run."
              exit 1
            fi

            echo "→ Pulling latest accounting-hub code into git mirror..."
            cd "$ACCT_DIR"
            git fetch origin main
            # Only update the accounting-hub/ subtree; preserve any in-flight edits
            # to the marketing hub (src/, prisma/, etc.) living at the repo root.
            git checkout origin/main -- accounting-hub/
            # Also sync client-portal/ and teletherapy/ source so the daily
            # snapshot of this directory captures the rebrand + any UI updates.
            git checkout origin/main -- client-portal/ 2>/dev/null || true
            git checkout origin/main -- teletherapy/   2>/dev/null || true
            git checkout origin/main -- .github/ scripts/ 2>/dev/null || true
            echo "   accounting-hub/ synced to: $(git log -1 --oneline origin/main -- accounting-hub/)"
            echo "   client-portal/  synced to: $(git log -1 --oneline origin/main -- client-portal/)"
            echo "   teletherapy/    synced to: $(git log -1 --oneline origin/main -- teletherapy/)"

            echo "→ Syncing git mirror to live deploy directory ($DEPLOY_DIR)..."
            # Excludes: .env files (authoritative versions live in DEPLOY_DIR/docker/
            # and are NOT in git — losing them costs NEXTAUTH_SECRET, EXTERNAL_API_KEY
            # and the DB URL), build artifacts, and user-uploaded files.
            # --delay-updates moves everything into place at the end, so the tree is
            # never half-old/half-new on disk.
            rsync -a --delete --delay-updates \
              --exclude='docker/.env' \
              --exclude='docker/.env.production' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='uploads' \
              "$ACCT_DIR/accounting-hub/" "$DEPLOY_DIR/"
            echo "   Source synced OK."

            # ── DB schema ─────────────────────────────────────────────────
            # There is deliberately NO migration loop here. This step used to run
            #   for sql_file in "$DEPLOY_DIR"/prisma/migrations/*/migration.sql
            # and psql every one of them with `|| true` on every deploy. That is
            # unsafe for this database:
            #   * /opt/accounting carried 1 migration folder; git carries 199. The
            #     migration history in git does not describe this DB, which has been
            #     live for 2+ years and takes schema changes out-of-band.
            #   * 20260402_reset_admin_password and 20260402_set_password_scei are
            #     unconditional `UPDATE "User" SET "passwordHash" = '<literal hash>'`
            #     — replaying them overwrites the CURRENT admin password with an old
            #     one on every single deploy.
            # Schema changes are applied by docker/redeploy.sh's additive-schema
            # block instead. Do not reintroduce a blanket replay loop; if a specific
            # migration must run, run that one deliberately.
            echo "→ Skipping migration replay by design (schema is applied out-of-band"
            echo "  via docker/redeploy.sh's additive block)."

            # ONE migration, run deliberately — per the guidance above, and not a
            # replay loop. redeploy.sh's additive block is a manual script this
            # workflow never invokes, so a column added only there never reaches
            # the database. These three are read by /api/accounts-receivable, so
            # the Guarantee Letters tab fails to load without them.
            # The file is idempotent (IF NOT EXISTS throughout, FK guarded), so
            # re-running on every deploy is harmless.
            GLP_SQL="$DEPLOY_DIR/prisma/migrations/20260821_gl_processor_payout/migration.sql"
            if [ -f "$GLP_SQL" ]; then
              echo "→ Applying GL processor payout columns..."
              docker exec -i accounting_db psql -U sapphire -d sapphire_accounting < "$GLP_SQL" \
                && echo "   GL processor columns applied." \
                || echo "   ⚠ GL processor column apply failed (non-fatal) — Detailed GL payout will error until fixed."
              docker exec accounting_db psql -U sapphire -d sapphire_accounting -tAc \
                "SELECT count(*) FROM information_schema.columns WHERE table_name='GlCase' AND column_name IN ('processorRfpId','processorPaidAt','processorProofUrl');" \
                | sed 's/^/   GlCase processor columns present: /' || true
            else
              echo "   (GL processor migration file not found — skipped.)"
            fi

            # Same deliberate-single-migration pattern: this pipeline never
            # replays prisma/migrations, so each schema change is named here.
            PVC_SQL="$DEPLOY_DIR/prisma/migrations/20260826_patient_view_checkout/migration.sql"
            if [ -f "$PVC_SQL" ]; then
              echo "→ Applying patient-view checkout table..."
              docker exec -i accounting_db psql -U sapphire -d sapphire_accounting < "$PVC_SQL" \
                && echo "   PatientViewCheckout applied." \
                || echo "   ⚠ PatientViewCheckout apply failed (non-fatal) — Patient View checkout will error until fixed."
              docker exec accounting_db psql -U sapphire -d sapphire_accounting -tAc \
                "SELECT count(*) FROM information_schema.tables WHERE table_name='PatientViewCheckout';" \
                | sed 's/^/   PatientViewCheckout table present: /' || true
            else
              echo "   (Patient-view migration file not found — skipped.)"
            fi

            # NOTE: the admin-password reset that used to live here has been removed
            # on the owner's instruction (2026-08-20). It hardcoded a bcrypt hash for
            # the password "SCEI" and reapplied it to main@ and admin@ on every
            # deploy, silently reverting any password change made since. If admin
            # access is ever lost, reset it deliberately with a one-off psql command
            # rather than restoring an automatic reset here.

            echo "→ Enabling GL auto-posting flag..."
            if grep -q "^ENABLE_GL_POSTING=" "$DOCKER_DIR/.env" 2>/dev/null; then
              sed -i 's|^ENABLE_GL_POSTING=.*|ENABLE_GL_POSTING=true|' "$DOCKER_DIR/.env"
              echo "   ENABLE_GL_POSTING set to true."
            else
              echo "ENABLE_GL_POSTING=true" >> "$DOCKER_DIR/.env"
              echo "   ENABLE_GL_POSTING=true appended."
            fi

            echo "→ Syncing postgres password to match $DOCKER_DIR/.env..."
            PG_PASS=$(grep "^POSTGRES_PASSWORD" "$DOCKER_DIR/.env" 2>/dev/null | cut -d= -f2-)
            echo "   POSTGRES_PASSWORD length: ${#PG_PASS}"
            if [ -n "$PG_PASS" ]; then
              docker exec accounting_db psql -U sapphire -d sapphire_accounting \
                -c "ALTER USER sapphire WITH PASSWORD '${PG_PASS}';" 2>&1 \
                && echo "   Postgres password synced OK" \
                || echo "   ⚠ Postgres password sync failed (non-fatal)"
            else
              echo "   ⚠ POSTGRES_PASSWORD not found in $DOCKER_DIR/.env"
            fi

            echo "→ One-time GL balance restore (2026-05-06 hotfix — safe to re-run)..."
            # These wallets had their Remaining Balance reset to totalGlAmount by a now-fixed
            # code bug (edit form was sending balance on every PUT). Only updates if the
            # balance is still at the exact wrong reset value; safe no-op otherwise.
            docker exec accounting_db psql -U sapphire -d sapphire_accounting -c "
              UPDATE \"DigitalWallet\" SET balance = 27812    WHERE id = 'cmnztc93f000u01pcz8v8b0hp' AND balance = 38546;
              UPDATE \"DigitalWallet\" SET balance = 28112    WHERE id = 'cmnzu9cea000m01o8ccfkz4oi' AND balance = 38846;
              UPDATE \"DigitalWallet\" SET balance = 33312.5  WHERE id = 'cmo9hyiww00i901nz3rz8gs9z' AND balance = 41612.5;
            " 2>&1 && echo "   GL balance restore done (0 rows = already correct)." || echo "   GL balance restore skipped/failed (non-fatal)."

            # Reclaim build cache BEFORE building — a full Next build here needs
            # ~8-15GB and this VPS has run out of disk mid-deploy before. Never
            # prune between the build and the container swap: that can drop the
            # image we are about to run.
            echo "→ Pruning docker build cache before building..."
            df -h / | tail -1
            docker builder prune -af 2>&1 | tail -2 || true
            df -h / | tail -1

            echo "→ Rebuilding and restarting via docker compose (from $DOCKER_DIR)..."
            cd "$DOCKER_DIR"
            docker compose build app 2>&1
            echo "   Image built successfully."
            # Clear orphaned rename-artefact containers before the swap. When a
            # previous recreate is interrupted, docker leaves the old container
            # renamed to "<hash>_accounting_app"; the next `up` then dies with
            # 'container name is already in use'. That is exactly how the guard's
            # recovery redeploy failed at 2026-08-17T07:44:33Z ("manual
            # intervention needed"). Only matches the hash-prefixed artefact, so
            # the real accounting_app is never touched.
            ORPHANS=$(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{8,}_accounting_app$' || true)
            if [ -n "$ORPHANS" ]; then
              echo "   Removing orphaned container(s): $ORPHANS"
              echo "$ORPHANS" | xargs -r docker rm -f 2>&1 || true
            else
              echo "   No orphaned accounting_app containers."
            fi

            docker compose up -d --force-recreate app 2>&1
            echo "   Container started."

            echo "→ Waiting 20s for app to stabilize..."
            sleep 20

            echo "→ Checking accounting-hub health..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ 2>&1 || echo "000")
            echo "   HTTP $HTTP_CODE"

            echo "→ Testing DB connectivity..."
            # Credential-free: the old check POSTed email/password=SCEI, which only
            # passed because the deploy had just reset the password to SCEI. With
            # that reset gone the login test would warn on every run and prove
            # nothing, so connectivity is checked directly instead.
            docker exec accounting_db psql -U sapphire -d sapphire_accounting \
              -tAc 'SELECT count(*) FROM "User";' 2>&1 \
              | sed 's/^/   User rows: /' \
              || echo "   ⚠ DB connectivity check failed"
            CSRF_JSON=$(curl -s http://localhost:3001/api/auth/csrf 2>/dev/null || echo '{}')
            if echo "$CSRF_JSON" | grep -q csrfToken; then
              echo "   ✅ Auth endpoint responding"
            else
              echo "   ⚠ Auth endpoint did not return a CSRF token"
            fi

            echo "→ Container logs (last 40 lines):"
            docker logs accounting_app --tail 40 2>&1 || true

            echo "→ Container env (auth-related, masked):"
            docker exec accounting_app env 2>/dev/null | grep -E "NEXTAUTH_URL|AUTH_TRUST|NODE_ENV" || true

            if [ "$HTTP_CODE" = "000" ]; then
              echo "❌ Health check failed"
              exit 1
            fi

            # ── Refresh the golden copy ───────────────────────────────────
            # The source guard restores src/ and prisma/ from $GOLDEN. Its hourly
            # refresh cron is disabled (#DISABLED-20260817, "poisoned golden with
            # wiped source"), so golden is frozen — as of 2026-08-20 its prisma/
            # dated from May. Without this step the next guard restore would roll
            # the app back to pre-deploy source. Only runs after the health check
            # passes, so a failed deploy can never poison golden.
            echo "→ Refreshing source-guard golden copy from the deployed tree..."
            mkdir -p "$GOLDEN"
            rsync -a --delete "$DEPLOY_DIR/src/"    "$GOLDEN/src/"    2>&1 && echo "   golden src/ refreshed"
            rsync -a --delete "$DEPLOY_DIR/prisma/" "$GOLDEN/prisma/" 2>&1 && echo "   golden prisma/ refreshed"
            cp "$DEPLOY_DIR/package.json" "$GOLDEN/package.json"      2>&1 && echo "   golden package.json refreshed"

            echo ""
            echo "✅ Accounting Hub deployed."

      # ── 9. Setup automated database backups ──
      - name: Setup Database Backups
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            BACKUP_DIR="/var/backups/sapphire-db"
            mkdir -p "$BACKUP_DIR"

            echo "→ Locking down upload directory permissions..."
            UPLOAD_ROOT="/var/www/sapphireclinicseast.org/teletherapy/uploads"
            mkdir -p "$UPLOAD_ROOT"
            # Restrict to root + www-data only — no world-readable files
            chown -R root:www-data "$UPLOAD_ROOT" 2>/dev/null || true
            chmod -R 750 "$UPLOAD_ROOT" 2>/dev/null || true

            echo "→ Setting up daily ONLINE + OFFLINE backup script..."
            # Generate a backup encryption key on first run (root-only, persistent)
            BACKUP_KEY_FILE="/etc/sapphire-backup.key"
            if [ ! -f "$BACKUP_KEY_FILE" ]; then
              openssl rand -base64 64 | tr -d '\n' > "$BACKUP_KEY_FILE"
              chmod 400 "$BACKUP_KEY_FILE"
              chown root:root "$BACKUP_KEY_FILE"
              echo "→ Generated new backup encryption key at $BACKUP_KEY_FILE (root-only)"
            fi

            cat > /usr/local/bin/sapphire-db-backup.sh << 'BACKUP_SCRIPT'
            #!/bin/bash
            set -e

            # ── Paths ──
            ONLINE_DIR="/var/backups/sapphire-db"               # Hot — fast recovery from VPS
            MIRROR_DIR="/var/backups/sapphire-mirror"           # Hot mirror on VPS
            OFFLINE_DIR="/var/backups/sapphire-offline"         # Cold encrypted, write-once, root-only
            UPLOADS_LIVE_MIRROR="/var/backups/sapphire-uploads-live"  # Live uploads mirror
            KEY_FILE="/etc/sapphire-backup.key"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            mkdir -p "$ONLINE_DIR" "$MIRROR_DIR" "$OFFLINE_DIR" "$UPLOADS_LIVE_MIRROR"
            chmod 700 "$ONLINE_DIR" "$MIRROR_DIR" "$UPLOADS_LIVE_MIRROR"
            chmod 700 "$OFFLINE_DIR"
            chown -R root:root "$OFFLINE_DIR" 2>/dev/null || true

            BACKUP_FILE="$ONLINE_DIR/sapphire_marketing_$TIMESTAMP.sql.gz"

            # ── DB dump ──
            docker exec sapphire_db pg_dump -U sapphire -d sapphire_marketing --no-owner --no-acl 2>/dev/null | gzip > "$BACKUP_FILE"

            if [ ! -s "$BACKUP_FILE" ]; then
              echo "$(date): ERROR - DB backup file is empty!"
              rm -f "$BACKUP_FILE"
              exit 1
            fi

            echo "$(date): ONLINE DB backup: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"
            sha256sum "$BACKUP_FILE" > "$BACKUP_FILE.sha256"

            # ── Uploads tar ──
            UPLOADS_BACKUP="$ONLINE_DIR/uploads_$TIMESTAMP.tar.gz"
            if [ -d "/var/www/sapphireclinicseast.org/teletherapy/uploads" ]; then
              tar -czf "$UPLOADS_BACKUP" -C /var/www/sapphireclinicseast.org/teletherapy uploads/ 2>/dev/null || true
              if [ -s "$UPLOADS_BACKUP" ]; then
                sha256sum "$UPLOADS_BACKUP" > "$UPLOADS_BACKUP.sha256"
                echo "$(date): ONLINE uploads backup: $UPLOADS_BACKUP ($(du -h "$UPLOADS_BACKUP" | cut -f1))"
              fi
            fi

            # ── Hot mirror (still ONLINE, second VPS location) ──
            rsync -a --delete "$ONLINE_DIR/" "$MIRROR_DIR/" 2>&1 | tail -3 || true
            echo "$(date): Hot mirror updated → $MIRROR_DIR"

            # ── Live uploads mirror ──
            rsync -a --delete /var/www/sapphireclinicseast.org/teletherapy/uploads/ "$UPLOADS_LIVE_MIRROR/" 2>&1 | tail -1 || true

            # ── OFFLINE encrypted backup (cold storage) ──
            # Encrypts the daily DB + uploads with AES-256, stores in write-once dir.
            # Even if the app server is fully compromised, these encrypted blobs
            # are useless without the root-only key in /etc/sapphire-backup.key.
            if [ -f "$KEY_FILE" ]; then
              KEY_PASS=$(cat "$KEY_FILE")

              # Encrypt DB dump
              OFFLINE_DB="$OFFLINE_DIR/db_$TIMESTAMP.sql.gz.enc"
              openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
                -in "$BACKUP_FILE" -out "$OFFLINE_DB" \
                -pass "pass:$KEY_PASS" 2>/dev/null
              sha256sum "$OFFLINE_DB" > "$OFFLINE_DB.sha256"

              # Encrypt uploads tar
              if [ -s "$UPLOADS_BACKUP" ]; then
                OFFLINE_UP="$OFFLINE_DIR/uploads_$TIMESTAMP.tar.gz.enc"
                openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
                  -in "$UPLOADS_BACKUP" -out "$OFFLINE_UP" \
                  -pass "pass:$KEY_PASS" 2>/dev/null
                sha256sum "$OFFLINE_UP" > "$OFFLINE_UP.sha256"
              fi

              # Make offline backups WRITE-ONCE (root can read, no one can modify)
              chmod -R 400 "$OFFLINE_DIR"/*.enc "$OFFLINE_DIR"/*.sha256 2>/dev/null || true
              chmod 700 "$OFFLINE_DIR"
              chattr +i "$OFFLINE_DIR"/*.enc 2>/dev/null || true   # immutable bit (best-effort)

              echo "$(date): OFFLINE encrypted cold backup written → $OFFLINE_DIR"
              echo "$(date):   - $(ls "$OFFLINE_DIR"/*_$TIMESTAMP.* 2>/dev/null | wc -l) file(s) created"
            else
              echo "$(date): ⚠ Offline encryption skipped — key file missing at $KEY_FILE"
            fi

            # ── Rotation ──
            # Local retention: 7 days (true off-site copies live in GitHub + Google Drive).
            find "$ONLINE_DIR" -name "sapphire_marketing_*.sql.gz*" -mtime +7 -delete 2>/dev/null || true
            find "$ONLINE_DIR" -name "uploads_*.tar.gz*" -mtime +7 -delete 2>/dev/null || true
            find "$MIRROR_DIR" -name "sapphire_marketing_*.sql.gz*" -mtime +7 -delete 2>/dev/null || true
            find "$MIRROR_DIR" -name "uploads_*.tar.gz*" -mtime +7 -delete 2>/dev/null || true

            # Offline: 7-day retention (need to remove immutable bit first)
            for f in $(find "$OFFLINE_DIR" -name "*.enc" -mtime +7 2>/dev/null); do
              chattr -i "$f" 2>/dev/null || true
              rm -f "$f" "$f.sha256" 2>/dev/null || true
            done

            # Permissions tightening
            chmod 600 "$ONLINE_DIR"/*.gz "$ONLINE_DIR"/*.sha256 2>/dev/null || true

            echo "$(date): ✅ Backup complete:"
            echo "  ONLINE  (hot, on VPS):    $(ls -1 "$ONLINE_DIR"/*.gz 2>/dev/null | wc -l) files in $ONLINE_DIR"
            echo "  MIRROR  (hot, on VPS):    $(ls -1 "$MIRROR_DIR"/*.gz 2>/dev/null | wc -l) files in $MIRROR_DIR"
            echo "  OFFLINE (cold, encrypted): $(ls -1 "$OFFLINE_DIR"/*.enc 2>/dev/null | wc -l) files in $OFFLINE_DIR"
            BACKUP_SCRIPT

            chmod +x /usr/local/bin/sapphire-db-backup.sh

            # ── Hourly uploads-only mirror script ──
            cat > /usr/local/bin/sapphire-uploads-mirror.sh << 'MIRROR_SCRIPT'
            #!/bin/bash
            # Continuously mirror uploads dir for fast recovery if files are deleted
            UPLOADS_LIVE_MIRROR="/var/backups/sapphire-uploads-live"
            mkdir -p "$UPLOADS_LIVE_MIRROR"
            chmod 700 "$UPLOADS_LIVE_MIRROR"
            rsync -a --delete /var/www/sapphireclinicseast.org/teletherapy/uploads/ "$UPLOADS_LIVE_MIRROR/" 2>&1 | tail -1
            MIRROR_SCRIPT
            chmod +x /usr/local/bin/sapphire-uploads-mirror.sh

            # Cron jobs:
            # - Daily full backup at 2:00 AM
            # - Hourly uploads mirror (clinical files uploaded throughout the day)
            CRON_DAILY="0 2 * * * /usr/local/bin/sapphire-db-backup.sh >> /var/log/sapphire-backup.log 2>&1"
            CRON_HOURLY="15 * * * * /usr/local/bin/sapphire-uploads-mirror.sh >> /var/log/sapphire-uploads-mirror.log 2>&1"

            CURRENT_CRON=$(crontab -l 2>/dev/null || true)
            NEW_CRON="$CURRENT_CRON"
            if ! echo "$CURRENT_CRON" | grep -q "sapphire-db-backup"; then
              NEW_CRON=$(printf "%s\n%s" "$NEW_CRON" "$CRON_DAILY")
            fi
            if ! echo "$CURRENT_CRON" | grep -q "sapphire-uploads-mirror"; then
              NEW_CRON=$(printf "%s\n%s" "$NEW_CRON" "$CRON_HOURLY")
            fi
            echo "$NEW_CRON" | sed '/^$/d' | crontab -
            echo "✅ Backup cron jobs installed (daily 2 AM + hourly uploads mirror)"

            # Run an immediate backup only if the most recent one is >20h old, so
            # frequent deploys don't pile up full backups (cron still runs daily 2 AM).
            LATEST_BK=$(ls -t /var/backups/sapphire-db/uploads_*.tar.gz 2>/dev/null | head -1)
            if [ -z "$LATEST_BK" ] || [ -n "$(find "$LATEST_BK" -mmin +1200 2>/dev/null)" ]; then
              echo "→ Running immediate backup..."
              /usr/local/bin/sapphire-db-backup.sh 2>&1
            else
              echo "→ Skipping immediate backup — a recent one (<20h) already exists."
            fi
            echo "✅ Backup setup complete (encrypted permissions, SHA256 checksums, hourly mirror)."

      # ── 9. Configure UFW Firewall ──
      - name: Configure Firewall
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "→ Configuring UFW firewall..."

            # Install ufw if not present
            which ufw >/dev/null 2>&1 || apt-get install -y ufw >/dev/null 2>&1

            # Reset to defaults (deny incoming, allow outgoing)
            ufw default deny incoming 2>/dev/null || true
            ufw default allow outgoing 2>/dev/null || true

            # Allow SSH (critical — don't lock yourself out)
            ufw allow 22/tcp comment "SSH"

            # Allow HTTP/HTTPS for web traffic
            ufw allow 80/tcp comment "HTTP"
            ufw allow 443/tcp comment "HTTPS"

            # Block direct access to app ports from outside (only nginx should reach them)
            # Port 3000 (marketing hub), 3001 (accounting), 3002 (teletherapy), 5432 (postgres)
            # These are NOT allowed through UFW — only accessible via localhost/Docker network
            ufw deny 3000/tcp comment "Block direct marketing-hub access" 2>/dev/null || true
            ufw deny 3001/tcp comment "Block direct accounting-hub access" 2>/dev/null || true
            ufw deny 3002/tcp comment "Block direct teletherapy access" 2>/dev/null || true
            ufw deny 5432/tcp comment "Block direct PostgreSQL access" 2>/dev/null || true

            # Enable UFW (non-interactive)
            echo "y" | ufw enable 2>/dev/null || true

            # Rate limit SSH to prevent brute force
            ufw limit 22/tcp comment "Rate limit SSH" 2>/dev/null || true

            echo "→ Firewall status:"
            ufw status verbose 2>&1

            echo "✅ Firewall configured."

      # ── 10. Prune Docker resources to keep VPS disk + RAM healthy ──
      # Docker builds + image rebuilds accumulate FAST on a single-VPS
      # multi-app stack (marketing, class-portal, accounting, teletherapy,
      # survey + their DBs). Without periodic pruning, /var/lib/docker
      # grows by GB per deploy and eventually OOM-kills the smaller
      # containers (accounting + class portal first).
      #
      # First version of this step used `until=48h` and `unused-for=24h`
      # time filters — which reclaimed 0 bytes because everything we'd
      # want pruned was created during THIS deploy. Filters removed.
      # Safety now comes from Docker's own "in-use" guards (`rmi` fails
      # on referenced images, `prune` skips active build cache) plus an
      # explicit allow-list that protects `:rollback` tags during the
      # aggressive fallback pass.
      #
      # SAFE pruning only — never touches volumes (Postgres data).
      - name: Prune Docker resources
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set +e  # never let pruning fail the deploy
            echo "==========================================="
            echo "BEFORE pruning"
            echo "==========================================="
            echo "→ Disk usage (/):"
            df -h / 2>&1 | tail -1
            echo "→ Memory:"
            free -m 2>&1 | head -3
            echo "→ Docker disk usage:"
            docker system df 2>&1
            DISK_BEFORE_KB=$(df / | awk 'NR==2 {print $3}')
            echo ""
            echo "==========================================="
            echo "Pruning..."
            echo "==========================================="

            # Stopped/exited/dead containers (never touches running ones).
            echo "→ Containers (stopped only)..."
            docker container prune -f 2>&1 | tail -3

            # Dangling images (untagged). Always safe — these are never
            # referenced by anything by definition.
            echo "→ Dangling images..."
            docker image prune -f 2>&1 | tail -3

            # Build cache — the big win. buildx maintains its own cache
            # store; `docker builder prune` only touches the legacy
            # cache. Use BOTH, with no time filter. Active builds keep
            # their layers automatically via reference counting.
            echo "→ Build cache (legacy)..."
            docker builder prune -a -f 2>&1 | tail -3
            echo "→ Build cache (buildx)..."
            docker buildx prune --all --force 2>&1 | tail -3 || true

            # Dangling networks.
            echo "→ Networks..."
            docker network prune -f 2>&1 | tail -3

            # Truncate per-container JSON log files >50MB. Docker's
            # default log driver does not rotate, so long-running
            # containers can produce many GB over weeks. Lowered from
            # 100MB → 50MB because logs are cheap to lose vs disk.
            echo "→ Container logs >50MB..."
            LOG_FREED_MB=0
            for f in $(find /var/lib/docker/containers -name "*-json.log" -size +50M 2>/dev/null); do
              sz_mb=$(($(stat -c %s "$f" 2>/dev/null || echo 0) / 1024 / 1024))
              LOG_FREED_MB=$((LOG_FREED_MB + sz_mb))
              echo "   truncating $f (${sz_mb}MB)"
              : > "$f"
            done
            echo "   total log space freed: ${LOG_FREED_MB}MB"

            # System tmpfiles + apt cache.
            echo "→ /tmp + apt cache..."
            find /tmp -mindepth 1 -maxdepth 1 -mtime +2 -exec rm -rf {} + 2>/dev/null
            apt-get clean 2>/dev/null

            # Untagged images that prune missed because they're not
            # dangling (they have a name like <none>:<none>). These
            # accumulate when buildx fails mid-build.
            echo "→ Orphan <none> images..."
            ORPHAN_IDS=$(docker images --filter "dangling=false" --format "{{.ID}} {{.Repository}}:{{.Tag}}" | awk '$2 == "<none>:<none>" {print $1}' | sort -u)
            for id in $ORPHAN_IDS; do
              docker rmi "$id" 2>/dev/null && echo "   removed $id" || true
            done

            # Aggressive fallback: if still >80% disk, prune ALL unused
            # tagged images. Protect :rollback tags first so the
            # deploy's manual-rollback hook still works.
            USAGE=$(df / | awk 'NR==2 {gsub("%",""); print $5}')
            if [ "$USAGE" -gt 80 ]; then
              echo "⚠️  Disk still ${USAGE}% — aggressive image prune"
              # Re-tag :rollback images under a temporary name so the
              # subsequent `prune -a` keeps them.
              for img in $(docker images --format "{{.Repository}}:{{.Tag}}" | grep ":rollback$"); do
                base="${img%:rollback}"
                docker tag "$img" "${base}:pruneproof" && echo "   protecting ${img}"
              done
              docker image prune -a -f 2>&1 | tail -3
              # Restore :rollback names from the protected tags.
              for img in $(docker images --format "{{.Repository}}:{{.Tag}}" | grep ":pruneproof$"); do
                base="${img%:pruneproof}"
                docker tag "$img" "${base}:rollback"
                docker rmi "${base}:pruneproof" 2>/dev/null
                echo "   restored ${base}:rollback"
              done
            else
              echo "→ Disk OK at ${USAGE}% — skipping aggressive pass."
            fi

            echo ""
            echo "==========================================="
            echo "AFTER pruning"
            echo "==========================================="
            echo "→ Disk usage (/):"
            df -h / 2>&1 | tail -1
            DISK_AFTER_KB=$(df / | awk 'NR==2 {print $3}')
            DELTA_MB=$(( (DISK_BEFORE_KB - DISK_AFTER_KB) / 1024 ))
            echo "→ Reclaimed: ${DELTA_MB} MB"
            echo "→ Memory:"
            free -m 2>&1 | head -3
            echo "→ Docker disk usage:"
            docker system df 2>&1
            echo ""
            echo "✅ Prune complete."

  # ── Diagnostic: accounting-hub logs ──────────────────────────
  check-accounting-logs:
    name: Check Accounting Hub Logs
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      - name: Fetch container logs and env check
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            echo "=== accounting_app last 80 lines ==="
            docker logs accounting_app --tail 80 2>&1

            echo "=== env vars (masked) ==="
            docker exec accounting_app env 2>/dev/null | grep -E "NEXTAUTH|AUTH_TRUST|DATABASE_URL|NODE_ENV" | sed "s|postgresql://[^@]*@|postgresql://***@|g"

            echo "=== Users in accounting DB (with passwordHash prefix) ==="
            docker exec accounting_db psql -U sapphire -d sapphire_accounting -c "SELECT id, email, role, LEFT(\"passwordHash\", 10) AS hash_prefix, \"lastLoginAt\", \"updatedAt\" FROM \"User\" ORDER BY \"createdAt\" LIMIT 10;" 2>&1 || echo "DB query failed"

            echo "=== DB column check: lastLoginAt exists ==="
            docker exec accounting_db psql -U sapphire -d sapphire_accounting -c "SELECT column_name, data_type FROM information_schema.columns WHERE table_name = '"'"'User'"'"' AND column_name IN ('"'"'lastLoginAt'"'"', '"'"'resetToken'"'"', '"'"'passwordHash'"'"');" 2>&1

            echo "=== Test login attempt (triggers [auth] logs) ==="
            CSRF=$(curl -s http://localhost:3001/api/auth/csrf | grep -o '"token":"[^"]*"' | cut -d'"' -f4 || echo "NO_CSRF")
            echo "CSRF token: $CSRF"
            if [ "$CSRF" != "NO_CSRF" ] && [ -n "$CSRF" ]; then
              curl -s -X POST http://localhost:3001/api/auth/callback/credentials \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "email=main%40sapphireclinicseast.org&password=SCEIAccounting2026%21&csrfToken=${CSRF}&callbackUrl=http%3A%2F%2Flocalhost%3A3001%2Fdashboard&redirect=false" \
                -o /dev/null -w "HTTP %{http_code}" 2>&1 || true
            fi

            echo ""
            echo "=== accounting_app logs AFTER test login ==="
            sleep 2
            docker logs accounting_app --tail 30 2>&1

            echo "=== Recent auth errors (nginx) ==="
            tail -20 /var/log/nginx/error.log 2>/dev/null | grep -i "accounting" || echo "no nginx errors"
          '
