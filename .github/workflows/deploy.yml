# ══════════════════════════════════════════════════════════════════
#  SAPPHIRE CLINICS EAST — Deploy to Netcup VPS
#
#  Runs automatically on every push to main (including CMS commits).
#  Replaces Netlify's build-and-deploy pipeline.
#
#  Required GitHub Secrets (Settings → Secrets → Actions):
#    VPS_HOST        — your Netcup VPS IP address
#    VPS_USER        — SSH username (usually root or debian)
#    VPS_SSH_KEY     — private SSH key (see setup guide in scripts/setup-vps.sh)
# ══════════════════════════════════════════════════════════════════

name: Deploy to Netcup VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repo ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Build content indexes from CMS markdown files ─────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build content indexes
        run: node scripts/build-content.js

      # ── 3. Set up SSH key directly ───────────────────────────────
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # ── 4. Sync files to VPS (rsync — fast incremental updates) ──
      - name: Deploy files to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='.claude' \
            --exclude='*.sh' \
            --exclude='nginx.conf' \
            --exclude='COMPANY LOGO/node_modules' \
            --exclude='COMPANY LOGO/package*.json' \
            --exclude='COMPANY LOGO/capture-intro.mjs' \
            --exclude='api/node_modules' \
            --exclude='data/' \
            --exclude='teletherapy/node_modules' \
            --exclude='teletherapy/.next' \
            --exclude='teletherapy/.env' \
            --exclude='teletherapy/uploads' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/sapphireclinicseast.org/

      # ── 5. Provision SSL for teletherapy subdomain (if needed) ──
      - name: Setup teletherapy SSL
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'if [ ! -d /etc/letsencrypt/live/teletherapy.sapphireclinicseast.org ]; then
               echo "→ Provisioning SSL for teletherapy.sapphireclinicseast.org..."
               certbot certonly --standalone --preferred-challenges http \
                 -d teletherapy.sapphireclinicseast.org \
                 --non-interactive --agree-tos \
                 -m admin@sapphireclinicseast.org \
                 --pre-hook "systemctl stop nginx" \
                 --post-hook "systemctl start nginx" \
                 && echo "✅ SSL cert obtained." \
                 || echo "⚠ SSL cert failed — will retry next deploy."
             else
               echo "✅ SSL cert already exists."
             fi'

      # ── 6. Update Nginx config & reload ─────────────────────────
      - name: Update Nginx config
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/nginx.conf \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/etc/nginx/sites-available/sapphireclinicseast.org
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "ln -sf /etc/nginx/sites-available/sapphireclinicseast.org /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx"

      # ── 6. Install survey API deps & start/restart ─────────────────
      - name: Setup & Restart Survey API
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'mkdir -p /var/www/sapphireclinicseast.org/data && \
             cd /var/www/sapphireclinicseast.org/api && \
             npm install --production && \
             if pm2 describe scei-survey >/dev/null 2>&1; then \
               pm2 restart scei-survey; \
             else \
               SURVEY_API_KEY=${SURVEY_API_KEY:-SCEI_SURVEY_KEY_2025} pm2 start survey-api.js --name scei-survey && pm2 save; \
             fi && \
             if [ ! -f /var/www/sapphireclinicseast.org/data/surveys.db ]; then \
               node seed-data.js; \
             fi'

      # ── 8. Deploy Teletherapy app ──────────────────────────────
      - name: Deploy Teletherapy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' << 'REMOTE_SCRIPT'
          set -e
          TELE_DIR="/var/www/sapphireclinicseast.org/teletherapy"
          if [ ! -d "$TELE_DIR" ]; then echo "⚠ Teletherapy dir not found, skipping."; exit 0; fi
          cd "$TELE_DIR"

          # Always recreate .env to ensure correct DATABASE_URL
          if true; then
            echo "→ Creating teletherapy .env..."
            MENV="/opt/sapphire/docker/.env.production"
            if [ -f "$MENV" ]; then
              PG_PASS=$(grep "^POSTGRES_PASSWORD" "$MENV" | cut -d= -f2-)
              DB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' sapphire_db 2>/dev/null || echo "localhost")
              echo "DATABASE_URL=postgresql://sapphire:${PG_PASS}@${DB_IP}:5432/sapphire_marketing" > .env
              echo "→ DB host: ${DB_IP}"
              grep "^NEXTAUTH_SECRET" "$MENV" >> .env
              echo "NEXTAUTH_URL=https://teletherapy.sapphireclinicseast.org" >> .env
              echo "AUTH_TRUST_HOST=true" >> .env
              grep "^GOOGLE_CLIENT_ID" "$MENV" >> .env 2>/dev/null || true
              grep "^GOOGLE_CLIENT_SECRET" "$MENV" >> .env 2>/dev/null || true
              grep "^GOOGLE_REDIRECT_URI" "$MENV" >> .env 2>/dev/null || true
              echo "UPLOAD_DIR=./uploads" >> .env
              echo "RESEND_API_KEY=re_CbH3Pirt_JqAd3RJ3TXwaFNmxckQ7GVwK" >> .env
              echo 'RESEND_FROM_EMAIL="SCEI Teletherapy <noreply@do-not-reply.sapphireclinicseast.org>"' >> .env
            else
              echo "DATABASE_URL=postgresql://sapphire:sapphire@localhost:5433/sapphire_marketing" > .env
              echo "NEXTAUTH_URL=https://teletherapy.sapphireclinicseast.org" >> .env
              echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> .env
              echo "AUTH_TRUST_HOST=true" >> .env
              echo "UPLOAD_DIR=./uploads" >> .env
              echo "RESEND_API_KEY=re_CbH3Pirt_JqAd3RJ3TXwaFNmxckQ7GVwK" >> .env
              echo 'RESEND_FROM_EMAIL="SCEI Teletherapy <noreply@do-not-reply.sapphireclinicseast.org>"' >> .env
            fi
            echo "✅ .env created."
          fi

          mkdir -p uploads/session-notes

          echo "→ Installing dependencies..."
          npm ci --production=false 2>&1 | tail -3

          echo "→ Generating Prisma client..."
          npx prisma generate 2>&1 | tail -2

          echo "→ Creating teletherapy tables..."
          cat prisma/setup.sql | docker exec -i sapphire_db psql -U sapphire -d sapphire_marketing 2>&1 || true

          echo "→ Building Next.js app..."
          npm run build 2>&1

          echo "→ Updating docker-compose and restarting postgres with port exposed..."
          cp /var/www/sapphireclinicseast.org/docker/docker-compose.yml /opt/sapphire/docker/docker-compose.yml 2>/dev/null || true
          cd /opt/sapphire/docker && docker compose --env-file .env.production up -d --force-recreate postgres 2>&1 | tail -3 || true
          sleep 5
          echo "→ Verifying postgres port..."
          pg_isready -h localhost -p 5432 2>&1 || echo "⚠ pg_isready not available, checking with docker..."
          docker exec sapphire_db pg_isready -U sapphire 2>&1 | tail -1

          echo "→ Seeding main admin account..."
          docker exec sapphire_db psql -U sapphire -d sapphire_marketing -c "
            ALTER TABLE \"TherapistAccount\" ADD COLUMN IF NOT EXISTS \"resetToken\" TEXT;
            ALTER TABLE \"TherapistAccount\" ADD COLUMN IF NOT EXISTS \"resetTokenExpiry\" TIMESTAMP(3);

            -- Create a system admin staff record if it doesn't exist
            INSERT INTO \"Staff\" (id, \"firstName\", \"lastName\", department, branch, status, \"createdAt\", \"updatedAt\")
            VALUES ('system-admin-staff', 'System', 'Administrator', 'ADMINISTRATION', 'SBEA', 'Active', NOW(), NOW())
            ON CONFLICT (id) DO NOTHING;

            -- Free Hannah Jara's staffId if the admin was previously linked to her
            UPDATE \"TherapistAccount\" SET \"staffId\" = 'system-admin-staff'
            WHERE id = 'clmainadmin01' AND \"staffId\" != 'system-admin-staff';

            -- Create admin account if it doesn't exist
            INSERT INTO \"TherapistAccount\" (id, \"staffId\", email, \"passwordHash\", role, \"isActive\", \"createdAt\", \"updatedAt\")
            VALUES ('clmainadmin01', 'system-admin-staff', 'main@sapphireclinicseast.org',
                   '\$2b\$12\$CzbS0M/M1L9Fj7EaChT0jO6d56oL.wFiGwaw5ayPlgjKzqBtd/64.',
                   'ADMIN', true, NOW(), NOW())
            ON CONFLICT (id) DO UPDATE SET email = 'main@sapphireclinicseast.org', role = 'ADMIN', \"isActive\" = true
            ON CONFLICT (email) DO NOTHING;
          " && echo "✅ Main admin seeded." || echo "⚠ Admin seed failed."

          cd /var/www/sapphireclinicseast.org/teletherapy

          echo "→ Starting teletherapy app..."
          pm2 delete scei-teletherapy 2>/dev/null || true
          PORT=3002 HOSTNAME=0.0.0.0 pm2 start npm --name scei-teletherapy -- start && pm2 save

          echo "→ Waiting 10s for app to stabilize..."
          sleep 10

          echo "→ PM2 status:"
          pm2 list 2>&1

          echo "→ PM2 logs (last 30 lines):"
          pm2 logs scei-teletherapy --lines 30 --nostream 2>&1 || true

          echo "→ Checking port 3002:"
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3002/ 2>&1 || echo "curl failed"

          echo ""
          echo "✅ Teletherapy deployed."
          REMOTE_SCRIPT

      # ── 8. Deploy Accounting Hub (Docker) ────────────────────────
      - name: Deploy Accounting Hub
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            ACCT_DIR="/opt/sapphire-marketing-hub"
            echo "→ Pulling latest accounting-hub code..."
            cd "$ACCT_DIR"
            git fetch origin main
            git reset --hard origin/main

            echo "→ Running DB migrations on accounting_db..."
            MIGRATION_DIR="$ACCT_DIR/accounting-hub/prisma/migrations"
            for sql_file in "$MIGRATION_DIR"/*/migration.sql; do
              docker exec -i accounting_db psql -U sapphire -d sapphire_accounting < "$sql_file" 2>&1 || true
            done

            echo "→ Rebuilding accounting-hub Docker image..."
            cd "$ACCT_DIR/accounting-hub/docker"
            docker compose --env-file .env.production build --no-cache app 2>&1 | tail -10

            echo "→ Restarting accounting-hub container..."
            docker compose --env-file .env.production up -d --force-recreate app 2>&1 | tail -5

            echo "→ Waiting 15s for container to stabilize..."
            sleep 15

            echo "→ Checking accounting-hub health..."
            curl -s -o /dev/null -w "HTTP %{http_code}" http://localhost:3001/ 2>&1 || echo "curl failed"

            echo ""
            echo "✅ Accounting Hub deployed."

      # ── 9. Setup automated database backups ──
      - name: Setup Database Backups
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            BACKUP_DIR="/var/backups/sapphire-db"
            mkdir -p "$BACKUP_DIR"

            echo "→ Setting up daily database backup script..."
            cat > /usr/local/bin/sapphire-db-backup.sh << 'BACKUP_SCRIPT'
            #!/bin/bash
            set -e
            BACKUP_DIR="/var/backups/sapphire-db"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="$BACKUP_DIR/sapphire_marketing_$TIMESTAMP.sql.gz"

            # Dump the database from the Docker container and compress
            docker exec sapphire_db pg_dump -U sapphire -d sapphire_marketing --no-owner --no-acl 2>/dev/null | gzip > "$BACKUP_FILE"

            if [ -s "$BACKUP_FILE" ]; then
              echo "$(date): Backup created: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"

              # Also backup uploaded files (session note attachments)
              UPLOADS_BACKUP="$BACKUP_DIR/uploads_$TIMESTAMP.tar.gz"
              if [ -d "/var/www/sapphireclinicseast.org/teletherapy/uploads" ]; then
                tar -czf "$UPLOADS_BACKUP" -C /var/www/sapphireclinicseast.org/teletherapy uploads/ 2>/dev/null || true
                echo "$(date): Uploads backup: $UPLOADS_BACKUP ($(du -h "$UPLOADS_BACKUP" | cut -f1))"
              fi

              # Keep only the last 30 days of backups (rotate old ones)
              find "$BACKUP_DIR" -name "sapphire_marketing_*.sql.gz" -mtime +30 -delete 2>/dev/null || true
              find "$BACKUP_DIR" -name "uploads_*.tar.gz" -mtime +30 -delete 2>/dev/null || true

              echo "$(date): Cleanup done. Current backups:"
              ls -lh "$BACKUP_DIR"/*.gz 2>/dev/null | tail -5
            else
              echo "$(date): ERROR - Backup file is empty!"
              rm -f "$BACKUP_FILE"
              exit 1
            fi
            BACKUP_SCRIPT

            chmod +x /usr/local/bin/sapphire-db-backup.sh

            # Setup daily cron job at 2:00 AM (if not already set)
            CRON_LINE="0 2 * * * /usr/local/bin/sapphire-db-backup.sh >> /var/log/sapphire-backup.log 2>&1"
            if ! crontab -l 2>/dev/null | grep -q "sapphire-db-backup"; then
              (crontab -l 2>/dev/null; echo "$CRON_LINE") | crontab -
              echo "✅ Daily backup cron job installed (2:00 AM)"
            else
              echo "✅ Backup cron job already exists"
            fi

            # Run an immediate backup now
            echo "→ Running immediate backup..."
            /usr/local/bin/sapphire-db-backup.sh 2>&1
            echo "✅ Database backup setup complete."

      # ── 9. Configure UFW Firewall ──
      - name: Configure Firewall
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "→ Configuring UFW firewall..."

            # Install ufw if not present
            which ufw >/dev/null 2>&1 || apt-get install -y ufw >/dev/null 2>&1

            # Reset to defaults (deny incoming, allow outgoing)
            ufw default deny incoming 2>/dev/null || true
            ufw default allow outgoing 2>/dev/null || true

            # Allow SSH (critical — don't lock yourself out)
            ufw allow 22/tcp comment "SSH"

            # Allow HTTP/HTTPS for web traffic
            ufw allow 80/tcp comment "HTTP"
            ufw allow 443/tcp comment "HTTPS"

            # Block direct access to app ports from outside (only nginx should reach them)
            # Port 3000 (marketing hub), 3001 (accounting), 3002 (teletherapy), 5432 (postgres)
            # These are NOT allowed through UFW — only accessible via localhost/Docker network
            ufw deny 3000/tcp comment "Block direct marketing-hub access" 2>/dev/null || true
            ufw deny 3001/tcp comment "Block direct accounting-hub access" 2>/dev/null || true
            ufw deny 3002/tcp comment "Block direct teletherapy access" 2>/dev/null || true
            ufw deny 5432/tcp comment "Block direct PostgreSQL access" 2>/dev/null || true

            # Enable UFW (non-interactive)
            echo "y" | ufw enable 2>/dev/null || true

            # Rate limit SSH to prevent brute force
            ufw limit 22/tcp comment "Rate limit SSH" 2>/dev/null || true

            echo "→ Firewall status:"
            ufw status verbose 2>&1

            echo "✅ Firewall configured."
