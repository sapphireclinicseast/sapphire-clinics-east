# One-shot workflow: clear any UFW block on the operator's home IP, install
# fail2ban with a whitelist so rapid-fire scp / ssh bursts no longer get us
# kicked out, and swap UFW's harsh `limit 22/tcp` rule for a plain `allow`.
#
# Runs from GitHub's IP pool — bypasses any SSH block on the operator's IP.
# Manual trigger only: Actions → "Unblock SSH + install fail2ban" → Run workflow.
name: Unblock SSH + install fail2ban

"on":
  workflow_dispatch:
    inputs:
      whitelist_ip:
        description: "Your home IP to whitelist (will bypass fail2ban bans)"
        required: true
        default: "119.93.111.198"

jobs:
  fix:
    name: Apply fail2ban + whitelist
    runs-on: ubuntu-latest
    steps:
      - name: Apply over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eo pipefail
            HOME_IP="${{ inputs.whitelist_ip }}"
            echo "→ Home IP to whitelist: $HOME_IP"

            echo ""
            echo "→ Flush any existing iptables bans for our IP..."
            iptables -S INPUT | grep "$HOME_IP" | awk '{$1="-D"; print}' | while read rule; do
              iptables $rule 2>/dev/null || true
            done
            # fail2ban may have also added it — unban via client if jail exists
            if systemctl is-active fail2ban >/dev/null 2>&1; then
              fail2ban-client set sshd unbanip "$HOME_IP" 2>/dev/null || true
            fi

            echo ""
            echo "→ Remove any UFW deny rules for our IP..."
            while ufw status numbered | grep -q "$HOME_IP"; do
              RULE_NUM=$(ufw status numbered | grep "$HOME_IP" | head -1 | awk -F'[][]' '{print $2}')
              [ -n "$RULE_NUM" ] && echo "y" | ufw delete "$RULE_NUM" || break
            done

            echo ""
            echo "→ Install fail2ban (if missing)..."
            if ! dpkg -s fail2ban >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y fail2ban
            else
              echo "   already installed"
            fi

            echo ""
            echo "→ Write /etc/fail2ban/jail.local with whitelist..."
            cat > /etc/fail2ban/jail.local <<EOF
            [DEFAULT]
            # Whitelist: localhost + the operator's home IP
            ignoreip = 127.0.0.1/8 ::1 $HOME_IP

            # Ban for 1 hour after 5 failed logins in a 10-min window
            bantime  = 3600
            findtime = 600
            maxretry = 5

            banaction = iptables-multiport
            backend   = systemd

            [sshd]
            enabled  = true
            port     = 22
            filter   = sshd
            logpath  = %(sshd_log)s
            maxretry = 5
            EOF

            echo ""
            echo "→ Enable + restart fail2ban..."
            systemctl enable fail2ban >/dev/null 2>&1
            systemctl restart fail2ban
            sleep 2

            echo ""
            echo "→ Swap UFW's 'limit 22/tcp' for a plain 'allow 22/tcp'..."
            # There may be one or two limit rules; remove all, then add allow
            while ufw status | grep -q "22/tcp.*LIMIT"; do
              echo "y" | ufw delete limit 22/tcp 2>&1 | tail -1 || break
            done
            ufw allow 22/tcp comment "SSH (rate-limited by fail2ban)" 2>&1 | tail -1 || true

            echo ""
            echo "→ Belt-and-suspenders: explicit ACCEPT for our IP at the top..."
            iptables -I INPUT 1 -s "$HOME_IP" -p tcp --dport 22 -j ACCEPT

            echo ""
            echo "━━━ STATUS ━━━"
            echo ""
            echo "▶ fail2ban sshd jail:"
            fail2ban-client status sshd || true
            echo ""
            echo "▶ ufw rules for port 22:"
            ufw status | grep -E '22/tcp|Status' || true
            echo ""
            echo "▶ iptables INPUT (first 5 rules):"
            iptables -L INPUT -n --line-numbers | head -8
            echo ""
            echo "✅ Done. Home IP $HOME_IP is whitelisted."
