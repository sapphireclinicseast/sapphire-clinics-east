<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Staff Log In — Sapphire Clinics East, Inc.</title>
  <meta http-equiv="refresh" content="0; url=https://teletherapy.sapphireclinicseast.org/login" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0f3a35; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 480px; text-align: center; }
    .card h1 { font-size: 22px; margin: 0 0 12px; font-weight: 700; }
    .card p { margin: 0 0 24px; color: #cfe2dd; line-height: 1.6; }
    .card a {
      display: inline-block; padding: 12px 24px; border-radius: 8px;
      background: #d97706; color: #fff; text-decoration: none; font-weight: 600;
    }
    .spin {
      width: 22px; height: 22px; margin: 0 auto 16px;
      border: 2px solid #cfe2dd; border-top-color: #d97706;
      border-radius: 50%; animation: r 0.8s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="spin" aria-hidden="true"></div>
      <h1>Opening Staff Portal…</h1>
      <p>Redirecting you to the Sapphire Clinics East staff login. If nothing happens, click below.</p>
      <a href="https://teletherapy.sapphireclinicseast.org/login">Continue to Staff Log In →</a>
    </div>
  </div>
  <script>
    window.location.replace('https://teletherapy.sapphireclinicseast.org/login');
  </script>
</body>
</html>
