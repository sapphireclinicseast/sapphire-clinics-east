<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Aura Health Rehab</title>
  <style>
    :root { --narra:#244952; --moss:#4A8073; --paper:#EDF3D9; --mid:#5E6655; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--paper); color:var(--narra);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:24px; }
    .card { max-width:360px; text-align:center; }
    img { width:64px; height:auto; margin-bottom:20px; }
    h1 { font-size:22px; margin:0 0 8px; }
    p { color:var(--mid); font-size:14px; line-height:1.5; margin:0 0 20px; }
    button { background:var(--narra); color:#fff; border:0; border-radius:12px;
      padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer; }
    button:active { transform:scale(.97); }
  </style>
</head>
<body>
  <div class="card">
    <img src="/aura-mark.png" alt="Aura Health Rehab" />
    <h1>You're offline</h1>
    <p>We can't reach Aura Health Rehab right now. Check your internet connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
