server {
    listen 80;
    server_name survey.sapphireclinicseast.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include snippets/security-headers.conf;
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name survey.sapphireclinicseast.org;

    ssl_certificate     /etc/letsencrypt/live/survey.sapphireclinicseast.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/survey.sapphireclinicseast.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/sapphireclinicseast.org;
    index survey.html;

    # Serve survey.html as the default page
    location = / {
        try_files /survey.html =404;
    }

    # Clean URLs for branch-specific daily targets (no access code prompt).
    location ~ ^/daily-targets/(sbea|sbgh)/?$ {
        try_files /daily-targets/index.html =404;
    }

    # Survey API — proxy to Next.js app
    location /api/customer-survey {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host marketing.sapphireclinicseast.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
