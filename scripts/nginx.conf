# ══════════════════════════════════════════════════════════════════
#  Nginx — Sapphire Clinics East, Inc.
#  sapphireclinicseast.org
#
#  INSTALL:
#    sudo cp /var/www/sapphireclinicseast.org/scripts/nginx.conf \
#            /etc/nginx/sites-available/sapphireclinicseast.org
#    sudo ln -s /etc/nginx/sites-available/sapphireclinicseast.org \
#               /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════════

# ── Redirect HTTP → HTTPS ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sapphireclinicseast.org www.sapphireclinicseast.org;

    # Allow Let's Encrypt ACME challenge through
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Everything else → HTTPS
    location / {
        return 301 https://sapphireclinicseast.org$request_uri;
    }
}

# ── Redirect www → non-www (HTTPS) ──────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sapphireclinicseast.org;

    ssl_certificate     /etc/letsencrypt/live/sapphireclinicseast.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sapphireclinicseast.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sapphireclinicseast.org$request_uri;
}

# ── Main site ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sapphireclinicseast.org;

    root  /var/www/sapphireclinicseast.org;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/sapphireclinicseast.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sapphireclinicseast.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-Frame-Options           SAMEORIGIN                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    # ── Static file serving ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── CMS admin panel ──────────────────────────────────────────
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    # ── GitHub OAuth proxy (for CMS login) ──────────────────────
    #    Forwards /oauth and /oauth/callback to the Node.js proxy
    #    running on localhost:3030
    location /oauth {
        proxy_pass         http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── /hiring → HR Platform job application page ──────────────
    #    Server-side proxy so visitors stay on sapphireclinicseast.org
    #    while seeing the application form hosted on hr.sapphireclinicseast.org.
    #    The HR app is on the same VPS, so we proxy to localhost:8080
    #    (HR's nginx vhost) to avoid going out and back over the internet.
    location = /hiring  { return 301 /hiring/; }
    location = /hiring/ {
        proxy_pass         https://hr.sapphireclinicseast.org/modules/hiring/apply;
        proxy_ssl_server_name on;
        proxy_ssl_name     hr.sapphireclinicseast.org;
        proxy_set_header   Host              hr.sapphireclinicseast.org;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # The upstream sets X-Frame-Options: DENY for browser security;
        # we hide it from the response since we're doing a same-origin proxy.
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;
        add_header Cache-Control "no-store" always;
    }
    # Hiring form makes calls to /api/hiring/... — proxy those too.
    location /api/hiring/ {
        proxy_pass         https://hr.sapphireclinicseast.org/api/hiring/;
        proxy_ssl_server_name on;
        proxy_ssl_name     hr.sapphireclinicseast.org;
        proxy_set_header   Host              hr.sapphireclinicseast.org;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 50M;     # resume uploads
        proxy_request_buffering off;
    }
    # Hiring posters live on the HR Platform's /uploads/ path; proxy them
    # so the apply page's <img> tags resolve under sapphireclinicseast.org.
    location /uploads/hiring-posters/ {
        proxy_pass         https://hr.sapphireclinicseast.org/uploads/hiring-posters/;
        proxy_ssl_server_name on;
        proxy_ssl_name     hr.sapphireclinicseast.org;
        proxy_set_header   Host              hr.sapphireclinicseast.org;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── Long-cache for media (filenames are stable) ─────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webp)$ {
        expires    30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── Short-cache + revalidate for JS/CSS (no content hashing) ─
    # We use ?v= query strings to bust cache; keep a short TTL so
    # users without the latest HTML still revalidate within an hour.
    location ~* \.(js|css)$ {
        expires    1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    # ── No-cache for HTML (always fresh) ────────────────────────
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── No-cache for content JSON (CMS posts) ───────────────────
    location ~* -index\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

    # ── Logs ─────────────────────────────────────────────────────
    access_log /var/log/nginx/sapphireclinicseast.access.log;
    error_log  /var/log/nginx/sapphireclinicseast.error.log;
}

# ── teletherapy.sapphireclinicseast.org ────────────────────────
# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name teletherapy.sapphireclinicseast.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS — reverse proxy to Next.js teletherapy app on port 3002
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name teletherapy.sapphireclinicseast.org;

    ssl_certificate     /etc/letsencrypt/live/teletherapy.sapphireclinicseast.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teletherapy.sapphireclinicseast.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-Frame-Options           SAMEORIGIN                             always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/teletherapy.access.log;
    error_log  /var/log/nginx/teletherapy.error.log;
}

# ── accounting.sapphireclinicseast.org ─────────────────────────
# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name accounting.sapphireclinicseast.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS — reverse proxy to accounting-hub Docker app on port 3001
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name accounting.sapphireclinicseast.org;

    ssl_certificate     /etc/letsencrypt/live/accounting.sapphireclinicseast.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounting.sapphireclinicseast.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-Frame-Options           SAMEORIGIN                             always;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Block git/env scanners
    location ~ /\.(git|env) { deny all; }

    access_log /var/log/nginx/accounting.access.log;
    error_log  /var/log/nginx/accounting.error.log;
}
