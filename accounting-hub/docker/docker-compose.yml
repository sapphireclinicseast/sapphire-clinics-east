name: accounting

services:
  postgres:
    image: postgres:16-alpine
    container_name: accounting_db
    restart: always
    environment:
      POSTGRES_DB: sapphire_accounting
      POSTGRES_USER: sapphire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - accounting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapphire -d sapphire_accounting"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: accounting_app
    restart: always
    # host.docker.internal must resolve to the host gateway on Linux so the app
    # can reach the HR Platform (pm2 on the host :3457) for payroll staff sync
    # and the taxes Service-Invoice status. Without this the hostname does not
    # resolve inside the container and those HR fetches fail silently.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sapphire:${POSTGRES_PASSWORD}@postgres:5432/sapphire_accounting
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      MARKETING_HUB_URL: ${MARKETING_HUB_URL:-https://operations.sapphireclinicseast.org}
      HR_PLATFORM_URL: ${HR_PLATFORM_URL:-http://host.docker.internal:3457}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      TELETHERAPY_HUB_URL: ${TELETHERAPY_HUB_URL:-https://teletherapy.sapphireclinicseast.org}
      TELETHERAPY_INTERNAL_API_KEY: ${TELETHERAPY_INTERNAL_API_KEY}
      # PayMongo POS integration (test-mode-first). Values live in DEPLOY_DIR/docker/.env.
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY:-}
      PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET:-}
      PAYMONGO_PUBLIC_KEY: ${PAYMONGO_PUBLIC_KEY:-}
      # Per-branch PayMongo merchant accounts — each branch has its own secret key.
      # Only the variable NAMES appear here; the secret values live in
      # DEPLOY_DIR/docker/.env and are never committed. Without these passthroughs the
      # app cannot see the per-account keys even when they are set in .env.
      # VERDANA falls back to PAYMONGO_SECRET_KEY above (the original single account).
      PAYMONGO_SECRET_KEY_AHEA: ${PAYMONGO_SECRET_KEY_AHEA:-}
      PAYMONGO_SECRET_KEY_AHGH: ${PAYMONGO_SECRET_KEY_AHGH:-}
      PAYMONGO_SECRET_KEY_VERDANA: ${PAYMONGO_SECRET_KEY_VERDANA:-}
      PAYMONGO_SECRET_KEY_AHI: ${PAYMONGO_SECRET_KEY_AHI:-}
      # Shipping weights pushed to verdanarehab.com. Compose passes variables
      # through explicitly, so a value in .env alone never reaches the app —
      # it has to be named here too.
      WEIGHT_SYNC_SECRET: ${WEIGHT_SYNC_SECRET:-}
      STORE_WEIGHT_SYNC_URL: ${STORE_WEIGHT_SYNC_URL:-https://verdanarehab.com/api/sync/weights}
      # Tier 3: Enable General Ledger auto-posting (POS Order, AR Payment,
      # Inventory Adjustment, Asset, Depreciation, Closing Entry). Defaults
      # to false so a fresh install stays inert until the operator opts in.
      ENABLE_GL_POSTING: ${ENABLE_GL_POSTING:-false}
      # Payslip PDFs live under /app/uploads (which IS bind-mounted to
      # /opt/accounting/uploads on the host) — NOT the in-container
      # default /app/data/payslips, which is ephemeral and gets wiped
      # every container rebuild.
      PDF_STORAGE_DIR: /app/uploads/payslips
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - /opt/accounting/uploads:/app/uploads

volumes:
  accounting_postgres_data:
