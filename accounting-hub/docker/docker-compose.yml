name: accounting

services:
  postgres:
    image: postgres:16-alpine
    container_name: accounting_db
    restart: always
    environment:
      POSTGRES_DB: sapphire_accounting
      POSTGRES_USER: sapphire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - accounting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapphire -d sapphire_accounting"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: accounting_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sapphire:${POSTGRES_PASSWORD}@postgres:5432/sapphire_accounting
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      MARKETING_HUB_URL: ${MARKETING_HUB_URL:-https://marketing.sapphireclinicseast.org}
      HR_PLATFORM_URL: ${HR_PLATFORM_URL:-http://host.docker.internal:3457}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      TELETHERAPY_HUB_URL: ${TELETHERAPY_HUB_URL:-https://teletherapy.sapphireclinicseast.org}
      TELETHERAPY_INTERNAL_API_KEY: ${TELETHERAPY_INTERNAL_API_KEY}
      # Tier 3: Enable General Ledger auto-posting (POS Order, AR Payment,
      # Inventory Adjustment, Asset, Depreciation, Closing Entry). Defaults
      # to false so a fresh install stays inert until the operator opts in.
      ENABLE_GL_POSTING: ${ENABLE_GL_POSTING:-false}
      # Payslip PDFs live under /app/uploads (which IS bind-mounted to
      # /opt/accounting/uploads on the host) — NOT the in-container
      # default /app/data/payslips, which is ephemeral and gets wiped
      # every container rebuild.
      PDF_STORAGE_DIR: /app/uploads/payslips
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - /opt/accounting/uploads:/app/uploads

volumes:
  accounting_postgres_data:
